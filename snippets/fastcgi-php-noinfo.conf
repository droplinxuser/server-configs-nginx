# FastCGI snippet for a location that only matches a URI ending in ".php"
# (`location = /index.php`, `location ~ [^/]\.php$`).  Such a URI has no
# PATH_INFO, so there is no fastcgi_split_path_info: $fastcgi_script_name is
# $uri and evaluating it runs no regular expression (the split ran one PCRE
# call on every request, guest-cache hits included).  "/x.php/y" never gets
# here: the per-application deny location answers 404 for ".php/".
try_files $fastcgi_script_name =404;
fastcgi_param PATH_INFO "";

include snippets/fastcgi-php-common.conf;
