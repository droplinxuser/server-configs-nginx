# FastCGI/PHP snippet compatible with the Ubuntu nginx package.
#
# Angie does not ship /etc/angie/snippets/fastcgi-php.conf, but every PHP
# template in this repository includes it.  Deploy this file with the rest of
# the tree (nginx_conf.sh rsyncs it into /etc/angie/snippets/).

fastcgi_split_path_info ^(.+?\.php)(/.*)$;
try_files $fastcgi_script_name =404;

set $path_info $fastcgi_path_info;
fastcgi_param PATH_INFO $path_info;

fastcgi_index index.php;
include fastcgi.conf;
