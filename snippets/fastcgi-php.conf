# FastCGI/PHP snippet compatible with the Ubuntu nginx package.
#
# nginx built from source does not install snippets/fastcgi-php.conf, but
# every PHP template in this repository includes it.  Deploy this file with
# the rest of the tree (ubuntu-setup-script's deployer rsyncs it into
# /etc/nginx/snippets/).

fastcgi_split_path_info ^(.+?\.php)(/.*)$;
try_files $fastcgi_script_name =404;

set $path_info $fastcgi_path_info;
fastcgi_param PATH_INFO $path_info;

# The parameters every PHP location shares (HTTP_HOST, HTTPS, the public
# port and scheme, early data, the blanked URL-override headers).
include snippets/fastcgi-php-common.conf;
