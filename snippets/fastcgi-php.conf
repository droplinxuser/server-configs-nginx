# FastCGI/PHP snippet compatible with the Ubuntu nginx package.
#
# Angie does not ship /etc/angie/snippets/fastcgi-php.conf, but every PHP
# template in this repository includes it.  Deploy this file with the rest of
# the tree (`deploy_angie_tree` in ubuntu-setup-script/setup.sh rsyncs it into
# /etc/angie/snippets/).

fastcgi_split_path_info ^(.+?\.php)(/.*)$;
try_files $fastcgi_script_name =404;

set $path_info $fastcgi_path_info;
fastcgi_param PATH_INFO $path_info;

fastcgi_index index.php;
include fastcgi.conf;

# PHP must see the host the cache key was built from, not the raw Host
# header: $php_http_host (http.d/fastcgi_host.conf) is the header only when
# it equals $host or "$host:$server_port", otherwise $host.  A fastcgi_param
# named HTTP_* replaces the request header of that name, so the raw value
# never reaches PHP.  SERVER_NAME is not touched: fastcgi.conf sets it from
# $server_name, which no request can influence.
fastcgi_param HTTP_HOST $php_http_host;

# TLS 1.3 early data (ssl_early_data on in h5bp/tls/policy_strict.conf) can be
# replayed.  $ssl_early_data is "1" while the handshake is still incomplete
# and empty otherwise, so the application can answer 425 Too Early to a
# request that changes state ($_SERVER['HTTP_EARLY_DATA']).  if_not_empty
# leaves the parameter out for every normal request, and because the name is
# HTTP_EARLY_DATA a client-sent "Early-Data" header is dropped either way and
# cannot forge or hide the flag.
fastcgi_param HTTP_EARLY_DATA $ssl_early_data if_not_empty;
