# Shared FastCGI parameters for every PHP location: included by
# snippets/fastcgi-php.conf (with PATH_INFO) and snippets/fastcgi-php-noinfo.conf
# (front controllers and scripts whose location only matches a URI ending
# in ".php").

fastcgi_index index.php;
include fastcgi.conf;

# PHP must see the host the cache key was built from, not the raw Host
# header: $php_http_host (http.d/fastcgi_host.conf) is the header only when
# it equals $host or "$host:$server_port", otherwise $host.  A fastcgi_param
# named HTTP_* replaces the request header of that name, so the raw value
# never reaches PHP.  SERVER_NAME is not touched: fastcgi.conf sets it from
# $server_name, which no request can influence.
fastcgi_param HTTP_HOST $php_http_host;

# PHP's HTTPS flag behind a TLS terminator (CDN, Cloudflare tunnel, load
# balancer): http.d/https_map.conf sets $app_https from X-Forwarded-Proto,
# and defaults to $https on a direct TLS listener.  This must come after
# fastcgi.conf, whose "HTTPS $https if_not_empty" would otherwise leave the
# parameter out on the plain-HTTP application leg.
fastcgi_param HTTPS $app_https;

# The application leg may listen on a Unix socket or a loopback port behind a
# terminator, where fastcgi.conf's $server_port is empty or not the public
# one: Chevereto built absolute URLs as "https://host:/image/..." and
# WordPress/XenForo saw a portless URL.  Give PHP the public port and scheme
# instead (custom.d/php_public_port.map still overrides the port for a
# NAT/Docker forward).
fastcgi_param SERVER_PORT $php_public_port;
fastcgi_param REQUEST_SCHEME $app_scheme;

# A client must not choose what PHP believes about its own connection or
# address.  nginx passes every request header as HTTP_*, so the raw
# X-Forwarded-*/X-Real-IP/Forwarded values used to reach the application:
# a cache MISS could render absolute URLs for an attacker's host, and an
# app-level IP allowlist could be spoofed.  http.d/https_map.conf trusts a
# header only from a local/declared proxy peer; otherwise these are the
# normalised host, the public port/scheme, and the direct peer.
fastcgi_param HTTP_X_FORWARDED_HOST  $php_http_host;
fastcgi_param HTTP_X_FORWARDED_PORT  $php_public_port;
fastcgi_param HTTP_X_FORWARDED_PROTO $app_scheme;
fastcgi_param HTTP_X_FORWARDED_FOR   $php_x_forwarded_for;
fastcgi_param HTTP_X_REAL_IP         $php_x_real_ip;
# RFC 7239 and the IIS method override have no consumer here.
fastcgi_param HTTP_FORWARDED          "";
fastcgi_param HTTP_X_HTTP_METHOD_OVERRIDE "";

# TLS 1.3 early data (ssl_early_data on in h5bp/tls/policy_strict.conf) can be
# replayed.  $ssl_early_data is "1" while the handshake is still incomplete
# and empty otherwise, so the application can answer 425 Too Early to a
# request that changes state ($_SERVER['HTTP_EARLY_DATA']).  if_not_empty
# leaves the parameter out for every normal request, and because the name is
# HTTP_EARLY_DATA a client-sent "Early-Data" header is dropped either way and
# cannot forge or hide the flag.
fastcgi_param HTTP_EARLY_DATA $ssl_early_data if_not_empty;

# IIS-style URL overrides: a framework that honours them (older Symfony and
# Laminas request objects, some PSR-7 stacks) routes to another path while
# the cache key, the credential limiter and the deny rules saw the requested
# one.  No application here needs them; h5bp/php_flarum.conf already blanked
# them, now every PHP location does.
fastcgi_param HTTP_X_ORIGINAL_URL "";
fastcgi_param HTTP_X_REWRITE_URL "";
