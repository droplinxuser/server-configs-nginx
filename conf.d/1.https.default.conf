# ----------------------------------------------------------------------
# | Default behavior for unknown hosts                                 |
# ----------------------------------------------------------------------
# Drop requests for unknown hosts.

# rename this file to 1.https.default.conf
# modify certificate to use hostname_ssl

server {
  listen      443 ssl default_server deferred backlog=16383 reuseport fastopen=256;
  listen [::]:443 ssl default_server deferred backlog=16383 reuseport fastopen=256;
  # The QUIC side of the catch-all.  Without it the first vhost that includes
  # h5bp/tls/http3.conf becomes the default for UDP 443, so any SNI (or none)
  # over HTTP/3 reached a real site and its certificate, bypassing the
  # unknown-SNI refusal below.  The UDP socket is harmless on a host that
  # never enables HTTP/3: the firewall keeps 443/udp closed until the
  # operator opens it.
  listen      443 quic default_server;
  listen [::]:443 quic default_server;

  server_name _;
  http2 on;

  include h5bp/limit_req/*_medium.conf;
  # Refuse unknown or missing SNI before any certificate is sent: the
  # self-signed default certificate names the host (hostname -f), which
  # would tie a CDN-fronted site to this origin IP for any scanner.  The
  # include stays: with SNI the TLS session cache of the default server is
  # the one OpenSSL resumes from, so removing it would break resumption for
  # every vhost on this listener.
  ssl_reject_handshake on;
  include h5bp/default_ssl.conf;
  return 444;
}
