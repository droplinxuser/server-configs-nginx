# ----------------------------------------------------------------------
# | Default behavior for unknown hosts                                 |
# ----------------------------------------------------------------------
# Drop requests for unknown hosts.

# rename this file to 1.https.default.conf
# modify certificate to use hostname_ssl

server {
  listen      443 ssl default_server deferred backlog=16383 reuseport fastopen=256;
  listen [::]:443 ssl default_server deferred backlog=16383 reuseport fastopen=256;
  # The QUIC side of the catch-all.  Without it the first vhost that includes
  # h5bp/tls/http3.conf becomes the default for UDP 443, so any SNI (or none)
  # over HTTP/3 reached a real site and its certificate, bypassing the
  # unknown-SNI refusal below.
  #
  # 443/udp is open: ubuntu-setup-script's `ufw allow 443` admits both TCP
  # and UDP.  On a host that never enables HTTP/3 this socket still answers
  # QUIC Initial packets, but ssl_reject_handshake below refuses every
  # handshake, so no certificate or site is reached through it.
  #
  # Socket options may be given only once per address:port, and this
  # catch-all owns them for UDP 443.  reuseport gives every worker its own
  # UDP socket and the kernel hashes each client address to one of them,
  # so the datagrams of a QUIC connection reach the worker that holds it
  # and HTTP/3 works with more than one worker (nginx's QUIC docs ask for
  # it; without it a datagram can reach the wrong worker and the connection
  # stalls).  rcvbuf/sndbuf ask for 4 MB per socket instead of the 256 KB
  # default (ubuntu-setup-script's net.core.rmem_max/wmem_max of 16-32 MB
  # allow it; the kernel only commits memory for queued datagrams), so a
  # burst of datagrams is not dropped.  A vhost that includes
  # h5bp/tls/http3.conf must not repeat any of these options.
  listen      443 quic default_server reuseport rcvbuf=4m sndbuf=4m;
  listen [::]:443 quic default_server reuseport rcvbuf=4m sndbuf=4m;

  server_name _;
  http2 on;

  include h5bp/limit_req/*_medium.conf;
  # Refuse unknown or missing SNI before any certificate is sent: the
  # self-signed default certificate names the host (hostname -f), which
  # would tie a CDN-fronted site to this origin IP for any scanner.  The
  # include stays: with SNI the TLS session cache of the default server is
  # the one OpenSSL resumes from, so removing it would break resumption for
  # every vhost on this listener.
  ssl_reject_handshake on;
  include h5bp/default_ssl.conf;
  return 444;
}
