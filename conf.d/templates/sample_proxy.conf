server {
    listen      80;
    listen [::]:80;
    server_name cdn.domain.com;
    return 301 https://cdn.domain.com$request_uri;
}

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    server_name cdn.domain.com;
    http2 on;

    include h5bp/tls/ssl_engine.conf;
    include h5bp/tls/policy_balanced.conf;

    ssl_certificate     /etc/letsencrypt/live/domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain.com/privkey.pem;

    #include h5bp/tls/auth_origin.conf;

    root      /var/www/cdn.domain.com/public;
    error_log /var/www/logs/nginx/domain.com.error.log;
    client_max_body_size 1m;

    ### Global Limit
    include h5bp/limit_req/*_high.conf;

    set $cdn_origin https://domain.com;
    # Host/SNI for the upstream hop.  proxy_pass uses a variable, so nginx
    # cannot fill $proxy_host (it stays empty): sending that produced an empty
    # Host header, no SNI and an all-empty cache-key host component.
    set $cdn_host domain.com;

    location / {
        try_files $uri @302_back;
        limit_except GET { deny all; }
        add_header Link "<$cdn_origin$request_uri>; rel=\"canonical\"";
        # add_header here replaces the server-level set from basic.conf.
        include h5bp/security/strict-transport-security.conf;
        include h5bp/security/referrer-policy.conf;
        include h5bp/security/x-content-type-options.conf;
        include h5bp/cross-origin/requests.conf;
    }

    ### XF2
    # /media/<id>/ is the media-gallery HTML route (permission-checked), not
    # an asset.  Caching it anonymously for 182 days at the edge served a
    # login redirect (or a stale 403) to every later visitor.
    location ~ ^/(?:attachments|proxy\.php) {
        try_files $uri @cdn_back;
        limit_except GET { deny all; }
    }

    location @302_back {
        return 302 $cdn_origin$request_uri;
    }

    location @cdn_back {
        limit_except GET { deny all; }
        proxy_pass $cdn_origin;
        include h5bp/proxy_cdn.conf;
        add_header Link "<$cdn_origin$request_uri>; rel=\"canonical\"";
        include h5bp/security/strict-transport-security.conf;
        include h5bp/security/referrer-policy.conf;
        include h5bp/security/x-content-type-options.conf;
        include h5bp/cross-origin/requests.conf;
    }

    include h5bp/basic.conf;
}
