server {
    listen      80;
    listen [::]:80;
    server_name domain.com www.domain.com;
    return 301 https://domain.com$request_uri;
}

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    include h5bp/tls/http3.conf;
    server_name www.domain.com;
    http2 on;

    include h5bp/hostname_ssl.conf;
    #include h5bp/tls/auth_origin.conf;
    return 301 https://domain.com$request_uri;
}

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    include h5bp/tls/http3.conf;
    server_name domain.com;
    http2 on;

    include h5bp/hostname_ssl.conf;
    #include h5bp/tls/auth_origin.conf;
    
    root      /var/www/domain.com/public;
    error_log /var/www/logs/nginx/domain.com.error.log;
    client_max_body_size 20m;

    # Guest full-page cache. Remove this include if the site serves
    # personalised content to anonymous visitors.
    include h5bp/wordpress_cache.conf;
    include h5bp/wordpress.conf;
    include h5bp/php_wp.conf;
    include h5bp/basic_headers.conf;
}
