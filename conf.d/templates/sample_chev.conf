server {
    listen      80;
    listen [::]:80;
    server_name domain.com www.domain.com;
    return 301 https://domain.com$request_uri;
}

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    server_name www.domain.com;
    http2 on;

    include h5bp/tls/ssl_engine.conf;
    include h5bp/tls/policy_balanced.conf;

    ssl_certificate     /etc/letsencrypt/live/domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain.com/privkey.pem;

    #include h5bp/tls/auth_origin.conf;
    return 301 https://domain.com$request_uri;
}

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    server_name domain.com;
    http2 on;

    include h5bp/tls/ssl_engine.conf;
    include h5bp/tls/policy_balanced.conf;

    ssl_certificate     /etc/letsencrypt/live/domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain.com/privkey.pem;

    #include h5bp/tls/auth_origin.conf;
    
    root      /var/www/domain.com/public;
    error_log /var/www/logs/angie/domain.com.error.log;

    ### Start Chev
    client_max_body_size 101m;

    # Uploads: media files only.  One regex: a media extension on a path
    # without a dot-segment ("/.x").  Anything else (scripts, dumps,
    # dotfiles, unknown types) falls through to `return 403`.  (?s): Angie
    # decodes %0A into $uri; see h5bp/location/security_xf.conf.
    location ^~ /images/ {
        location ~* "(?s)^(?!.*/\.).*\.(?:gif|jpg|jpe|jpeg|png|ico|webp|avif|avifs|jxl|heic|heif|apng|bmp|svg|mov|mp4|webm|mkv|m4v|avi|mp3|ogg|oga|opus|m4a|wav)$" {
        #gzip_static off;
        sendfile off;
        # One Cache-Control: adding it here and `expires 365d` below produced
        # two headers with contradictory directives.
        add_header Cache-Control "public, max-age=31536000, immutable, stale-while-revalidate=86400, stale-if-error=604800";
        # add_header here replaces the server-level set from basic_headers.conf.
        include h5bp/security/x-content-type-options.conf;
        include h5bp/security/strict-transport-security.conf;
        access_log off;
        log_not_found off;
        error_page 404 /content/images/system/default/404.png;
        break;
        }
    return 403;
    }

    location / {
        index index.php;
        try_files $uri $uri/ /index.php$is_args$query_string;
    }

    # Optional HTTP basic auth on the admin routes (no regex): uncomment.
    #location ^~ /dashboard {
    #    auth_basic "Private";
    #    auth_basic_user_file htpasswd/chev;
    #    try_files $uri /index.php$is_args$query_string;
    #}
    ### End Chev

    # Every deny rule (app/, importing/, dotfiles, dumps, archives ...) is in
    # h5bp/location/security_chev.conf, included by php_chev_cache.conf.
    include h5bp/php_chev_cache.conf;
    include h5bp/basic_headers.conf;
}
