server {
    listen      80;
    listen [::]:80;
    server_name domain.com;
    return 301 https://domain.com$request_uri;
}

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    server_name domain.com;
    http2 on;

    ### Not using CF
    include h5bp/tls/ssl_engine.conf;
    include h5bp/tls/policy_balanced.conf;

    ssl_certificate     /etc/letsencrypt/live/domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain.com/privkey.pem;

    ### If using CF, replace the explicit ssl_engine/policy includes above
    ### with h5bp/hostname_ssl.conf (do not include both: ssl_session_timeout
    ### would be defined twice).
    #include h5bp/hostname_ssl.conf;
    #include h5bp/tls/auth_origin.conf;

    root      /var/www/psitransfer/public;
    error_log /var/www/logs/angie/domain.com.error.log;
    client_max_body_size 100m;

    ### Global Limit
    include h5bp/limit_req/*_high.conf;
  
    location / {
      try_files $uri @backend;
    }

    location @backend {
      proxy_pass http://127.0.0.1:3000;
      include h5bp/proxy_non_php.conf;
    }

    location ~* "/files/([\w]{12})(.*)$" {
      # The old sample contained an `if ($302_method = yy)` block, but that
      # variable is never defined, so it was dead code. Use a map in
      # http.d/ if a real redirect condition is needed:
      #   map $arg_redirect $psi_redirect { default 0; yy 1; }
      # A conditional response still needs `if`, because map cannot return.
      try_files $uri @backend;
    }

    include h5bp/basic.conf;

    ### PSI redirects
    error_page 500 502 503 504 =503 /5xx.html;
    location = /about   { return 302 https://site.net/t/123/; }
    location = /contact { return 302 https://site.net/contact;    }
}
