server {
    listen 80;
    server_name sample.com www.sample.com;
    return 301 https://sample.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.sample.com;
    http2 on;
    include h5bp/hostname_ssl.conf;
    return 301 https://sample.com$request_uri;
}

server {
    listen 443 ssl;
    server_name sample.com;
    http2 on;

    include h5bp/hostname_ssl.conf;
    root      /var/www/pingvin_source/frontend/public;
    error_log /var/www/pingvin_data/nginx_error.log;

    ### Proxy server
    set_real_ip_from 1.2.3.4;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    if ($realip_remote_addr != "1.2.3.4") { return 444; }

    client_max_body_size 512m;
    limit_rate_after     5m;
    limit_rate           5m;

    location / {
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass http://localhost:3030;
        include h5bp/proxy_non_php.conf;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        include h5bp/proxy_non_php.conf;
    
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
  
        limit_rate 0;
    }

    location ^~ /_next/static/ {
        alias /var/www/pingvin_source/frontend/.next/static/;
        try_files $uri @backend;
    }

    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store" always;
    }

    location /5xx.html {
        alias /var/www/pingvin_source/5xx.html;
        try_files $uri @backend;
    }

    include h5bp/basic.conf;
    error_page 500 502 503 504 =503 /5xx.html;
    location = /about   { return 302 https://sample.org/t/359698/; }
    location = /contact { return 302 https://sample.org/contact;   }

    ### Force 404
    location = /share/xxxx { return 404; }
    location = /share/zzzz { return 404; }
}
