# https://docs.github.com/actions

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    name: Tree guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # SERVER_SOFTWARE "nginx" without a version in both FastCGI files, no
      # trace of the previous web server, nginx.conf/pid/log layout, pinned
      # ubuntu-setup-script ref.
      - name: Static guards
        run: bash scripts/ci-guards.sh

  config:
    name: nginx -t (ubuntu-setup-script build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The binary under test is ubuntu-setup-script's own build (same
      # configure module set as the fleet, static Brotli, branding patch),
      # from the ref pinned in scripts/uss-ref, not nginx.org's package.
      - name: Pinned ubuntu-setup-script ref
        id: uss
        run: echo "ref=$(tr -d '[:space:]' < scripts/uss-ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: droplinxuser/ubuntu-setup-script
          ref: ${{ steps.uss.outputs.ref }}
          path: .uss

      # CI mode compiles with the system toolchain and libraries (no LTO,
      # BOLT or -march=native); the tool installs anything else it needs.
      - name: Build prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential cmake perl curl ca-certificates \
            gnupg xz-utils libssl-dev libpcre2-dev zlib1g-dev libbrotli-dev

      # Downloaded source tarballs (nginx, OpenSSL, PCRE2, zlib-ng, Brotli,
      # ngx_brotli) and their first-use pins.  The key changes whenever the
      # pinned ubuntu-setup-script ref, its version file or the build tool
      # changes, so a cache never outlives the recipe that filled it; with
      # "latest" versions the tool still downloads a newer release into it.
      - name: Source cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nginx-src-cache
          key: nginx-src-${{ runner.os }}-${{ steps.uss.outputs.ref }}-${{ hashFiles('.uss/nginx-build.conf', '.uss/tools/nginx-build.sh') }}

      - name: Build nginx (tools/nginx-build.sh build-only, NGINX_BUILD_CI=1)
        run: |
          sudo NGINX_BUILD_CACHE="$RUNNER_TEMP/nginx-src-cache" \
            bash scripts/ci-build-nginx.sh .uss "$RUNNER_TEMP/nginx-ci"

      # The build runs as root and leaves the cache mode 0700; actions/cache
      # saves it as the runner user in the post step.  Build work directories
      # are not worth caching.
      - name: Hand the source cache back to the runner user
        if: always()
        run: |
          c="$RUNNER_TEMP/nginx-src-cache"
          if [ -d "$c" ]; then
            sudo rm -rf "$c"/build.* "$c"/bolt.*
            sudo chown -R "$(id -u):$(id -g)" "$c"
          fi

      - name: Configuration test (base tree, every vhost template, branding)
        run: |
          bin=$(cat "$RUNNER_TEMP/nginx-ci/nginx-bin.path")
          sudo CI=true NGINX_BIN="$bin" bash scripts/ci-config-test.sh

  lint:
    name: ShellCheck and addresses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The address check lives in the paired setup repository.
      - uses: actions/checkout@v7
        with:
          repository: droplinxuser/ubuntu-setup-script
          path: .uss

      - name: No public server addresses
        run: bash .uss/tools/check-public-ips.sh "$GITHUB_WORKSPACE"

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh
