[global]
log_level = error

pid       = /run/php/php8.4-fpm.pid
error_log = /var/www/logs/php/php-fpm.log

emergency_restart_threshold = 100
emergency_restart_interval = 1m
process_control_timeout = 60s

rlimit_files = 524288
rlimit_core = 0

[www]
user  = www-data
group = www-data

listen = /run/php/php-fpm.sock
listen.backlog = 65535

listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = static

; (PHP_RAM_GB x 1024) / 128
pm.max_children = 64

; CPU_thread x 1024
pm.max_requests = 65536

rlimit_files = 524288
rlimit_core = 0

request_terminate_timeout = 300s
request_slowlog_timeout = 5s
slowlog = /var/www/logs/php/php-fpm-slow.log
catch_workers_output = yes
security.limit_extensions = .php
