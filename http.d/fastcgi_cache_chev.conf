### Start FastCGI Cache ###
# URIs the Chevereto guest cache never stores.  Case-insensitive and tolerant
# of repeated slashes: $request_uri is the raw request line, so "//api/" and
# "/Api/" must not slip past the prefix.
map $request_uri $chev_nocache_uri {
    default                 0;
    ~*^/+account            1;
    ~*^/+api                1;
    ~*^/+captcha-verify     1;
    ~*^/+connect            1;
    ~*^/+dashboard          1;
    ~*^/+delete             1;
    ~*^/+install            1;
    ~*^/+json               1;
    ~*^/+login              1;
    ~*^/+logout             1;
    ~*^/+page/+contact      1;
    ~*^/+signup             1;
    ~*^/+update             1;
    ~*^/+upload             1;
    # ?lang=xx stores the visitor's language in a cookie.
    ~*[?&]lang=             1;
    # The home page, with or without a query string (/?random), is dynamic.
    ~^/+\?                  1;
    "~^/+$"                1;
    }

# A request that authenticates with a header: the Chevereto API (X-API-Key)
# or HTTP authentication (Authorization).  Its response belongs to that
# client alone and is never stored in, or answered from, the guest cache.
map "$http_x_api_key$http_authorization" $chev_api_request {
    ""      0;
    default 1;
}

# 1 when the guest cache must stay out of the way: a no-cache URI or a
# header-authenticated request (same construction as $nocacheuri in
# http.d/fastcgi_cache.conf).
map "$chev_nocache_uri:$chev_api_request" $nocacheuri_chev {
    default 1;
    "0:0"   0;
}

# A PHP session or a login cookie (KEEP_LOGIN, KEEP_LOGIN_GOOGLE, ...): the
# page must be rendered for this visitor, because Chevereto embeds the
# session's auth_token in it.
map $http_cookie $chev_guest_cookie {
    default      0;
    ~*PHPSESSID= 1;
    ~*KEEP_LOGIN 1;
    # A visitor who picked a language must not get (or fill) the shared page.
    ~*USER_SELECTED_LANG= 1;
}

# 1 when h5bp/php_chev_cache.conf may answer from the guest cache: GET/HEAD
# ($guest_cache_method, http.d/fastcgi_cache.conf), no session/login cookie,
# cacheable URI, no API key or Authorization header ($nocacheuri_chev covers
# both).
map "$guest_cache_method:$chev_guest_cookie:$nocacheuri_chev" $chev_guest_cacheable {
    default 0;
    "1:0:0" 1;
}

# First language tag of Accept-Language, as sent ("zh-CN", "en",
# "pt-BR"; a longer tag falls back to its base language); anything else is the site default.  Used both as the
# header PHP sees and in the guest cache key (h5bp/php_chev_cache.conf).
map $http_accept_language $chev_key_lang {
    default "";
    "~*^(?<chev_lang_tag>[a-z]{2,3}(?:-[a-z0-9]{2,4})?)(?:[,;]|$)" $chev_lang_tag;
    "~*^(?<chev_lang_base>[a-z]{2,3})(?:[-,;]|$)" $chev_lang_base;
}

fastcgi_cache_path /home/nginx_cache_chev levels=1:2 keys_zone=fastcgicache_chev:1024m max_size=16g inactive=1h use_temp_path=off;
### End FastCGI Cache ####
