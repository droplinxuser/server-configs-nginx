### FastCGI Cache ###
# URIs the XenForo guest cache never stores.  Both URL styles are listed:
# friendly (/login/...) and the default (/index.php?login/... and /?login/...,
# which XenForo routes the same way).  The match is case-insensitive and
# accepts repeated slashes: $request_uri is the raw request line, and
# "//api/", "/Api/" and "/?api/" all used to slip past the exact prefixes.
map $request_uri $xf_nocache_uri {
    default          0;
    ~*^/+admin\.php  1;
    ~*^/+api         1;
    ~*^/+connected_account\.php 1;
    ~*^/+contact       1;
    ~*^/+install       1;
    ~*^/+login         1;
    ~*^/+logout        1;
    ~*^/+lost-password 1;
    ~*^/+misc          1;
    ~*^/+register      1;
    ~*^/+(?:index\.php)?/*\?/*(?:api|contact|login|logout|lost-password|misc|register) 1;
}

# A request that authenticates with a header instead of a cookie: the XenForo
# REST API (XF-Api-Key, XF-Api-User), OAuth2 or HTTP authentication
# (Authorization).  Its response belongs to that client alone, whatever the
# URI looks like (a percent-encoded /%61pi/ still reaches the API route), so
# it must never be stored in, or answered from, the guest cache.
map "$http_xf_api_key$http_xf_api_user$http_authorization" $xf_api_request {
    ""      0;
    default 1;
}

# 1 when the guest cache must stay out of the way: a no-cache URI or a
# header-authenticated request.  The name is historic; h5bp/php_xf.conf and
# the fastcgi_no_cache/fastcgi_cache_bypass lines that setup.sh --optimize
# rewrites all consume $nocacheuri, so the header test is folded in here
# rather than added as one more variable every consumer would have to list.
map "$xf_nocache_uri:$xf_api_request" $nocacheuri {
    default 1;
    "0:0"   0;
}

# Only GET and HEAD are ever served from a guest cache.
map $request_method $guest_cache_method {
    default 0;
    GET     1;
    HEAD    1;
}

# A XenForo session, login or two-step cookie: the visitor is not a guest.
map $http_cookie $xf_guest_cookie {
    default 0;
    ~*xf_session=       1;
    ~*xf_session_admin= 1;
    ~*xf_user=          1;
    ~*xf_tfa_trust=     1;
}

# 1 when h5bp/php_xf.conf may answer from the guest cache: GET/HEAD, no
# session/login cookie, cacheable URI, no API key or Authorization header
# ($nocacheuri covers both).  Everything else stays in the uncached PHP
# location and keeps its Set-Cookie headers.
# Cache-key tokens.  XenForo renders a guest page per style, style variation
# and language, all chosen by cookies the visitor controls.  Only a
# well-formed value enters the key (anything else renders the default and
# shares its entry), so a forged cookie can neither overwrite another URL's
# entry nor grow the cache without bound through free-form values.
map $cookie_xf_style_variation $xf_key_variation {
    default "";
    "~^[A-Za-z0-9_-]{1,32}$" $cookie_xf_style_variation;
}
map $cookie_xf_style_id $xf_key_style {
    default "";
    "~^[0-9]{1,6}$" $cookie_xf_style_id;
}
map $cookie_xf_language_id $xf_key_language {
    default "";
    "~^[0-9]{1,6}$" $cookie_xf_language_id;
}
# The stored body differs by encoding: XenForo gzips its own output, and
# WordPress/Chevereto do when PHP compresses for their document root
# (zlib.output_compression; setup.sh writes that per root).  A page stored
# compressed is sent as is, about 0.1 ms of CPU per hit instead of 1 ms to
# compress it again on every hit.  Two variants only: gzip or plain; a client
# without gzip gets the plain entry, compressed on the fly as before.
map $http_accept_encoding $guest_cache_enc {
    default "";
    ~*gzip  gzip;
}

map "$guest_cache_method:$xf_guest_cookie:$nocacheuri" $xf_guest_cacheable {
    default 0;
    "1:0:0" 1;
}

fastcgi_cache_path /home/nginx_cache levels=1:2 keys_zone=fastcgicache:256m max_size=16g inactive=1h use_temp_path=off;
