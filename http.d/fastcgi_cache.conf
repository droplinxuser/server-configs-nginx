### FastCGI Cache ###
# URIs the XenForo guest cache never stores.  Both URL styles are listed:
# friendly (/login/...) and the default (/index.php?login/...).
map $request_uri $nocacheuri {
    default          0;
    ~^/admin.php     1;
    ~^/api           1;
    ~^/connected_account\.php 1;
    ~^/contact       1;
    ~^/install       1;
    ~^/login         1;
    ~^/logout        1;
    ~^/lost-password 1;
    ~^/misc          1;
    ~^/register      1;
    ~^/index\.php\?/?(api|contact|login|logout|lost-password|misc|register) 1;
}

# Only GET and HEAD are ever served from a guest cache.
map $request_method $guest_cache_method {
    default 0;
    GET     1;
    HEAD    1;
}

# A XenForo session, login or two-step cookie: the visitor is not a guest.
map $http_cookie $xf_guest_cookie {
    default 0;
    ~*xf_session=       1;
    ~*xf_session_admin= 1;
    ~*xf_user=          1;
    ~*xf_tfa_trust=     1;
}

# 1 when h5bp/php_xf.conf may answer from the guest cache: GET/HEAD, no
# session/login cookie, cacheable URI.  Everything else stays in the
# uncached PHP location and keeps its Set-Cookie headers.
map "$guest_cache_method:$xf_guest_cookie:$nocacheuri" $xf_guest_cacheable {
    default 0;
    "1:0:0" 1;
}

fastcgi_cache_path /home/nginx_cache levels=1:2 keys_zone=fastcgicache:256m max_size=16g inactive=1h use_temp_path=off;
