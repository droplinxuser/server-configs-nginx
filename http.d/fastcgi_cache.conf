### FastCGI Cache ###
# URIs the XenForo guest cache never stores.  Both URL styles are listed:
# friendly (/login/...) and the default (/index.php?login/... and /?login/...,
# which XenForo routes the same way).  The match is case-insensitive, accepts
# repeated slashes and reads $request_uri: try_files rewrites a pretty URL to
# /index.php, so $uri would no longer carry the route.  Prefixes match at a
# path boundary so a board in a subdirectory ("/forum/login") is covered too.
#
# One alternation instead of one pattern per route: nginx tries a map's
# regular expressions in order until one matches, so an ordinary page (which
# matches none) paid eleven PCRE calls on every guest-cache hit.  The single
# pattern accepts exactly the same URIs.
map $request_uri $xf_nocache_uri {
    default          0;
    "~*(?:^|/)(?:admin\.php|api|connected_account\.php|contact|install|login|logout|lost-password|misc|register)(?:[/?]|$)|(?:^|/)(?:index\.php)?/*\?/*(?:api|contact|login|logout|lost-password|misc|register)" 1;
}

# A request that authenticates with a header instead of a cookie: the XenForo
# REST API (XF-Api-Key, XF-Api-User), OAuth2 or HTTP authentication
# (Authorization).  Its response belongs to that client alone, whatever the
# URI looks like (a percent-encoded /%61pi/ still reaches the API route), so
# it must never be stored in, or answered from, the guest cache.
map "$http_xf_api_key$http_xf_api_user$http_authorization" $xf_api_request {
    ""      0;
    default 1;
}

# 1 when the guest cache must stay out of the way: a no-cache URI or a
# header-authenticated request.  The name is historic; h5bp/php_xf.conf and
# the fastcgi_no_cache/fastcgi_cache_bypass lines that setup.sh --optimize
# rewrites all consume $nocacheuri, so the header test is folded in here
# rather than added as one more variable every consumer would have to list.
map "$xf_nocache_uri:$xf_api_request" $nocacheuri {
    default 1;
    "0:0"   0;
}

# Only GET and HEAD are ever served from a guest cache.
map $request_method $guest_cache_method {
    default 0;
    GET     1;
    HEAD    1;
}

# 1 when the path carries a percent-encoded character.  Every guest-cache
# bypass map reads the raw $request_uri (try_files has already rewritten the
# decoded $uri to /index.php), so "/%77p-admin/" or "/%61pi/" reaches the
# application while no bypass keyword matches and the response could be
# stored.  Such a request is never cached or answered from a cache: real
# clients do not encode ASCII route names, and a UTF-8 slug that does still
# works, it is simply rendered by PHP.
map $request_uri $req_encoded_path {
    "~^[^?]*%" 1;
    default    0;
}

# ---------------------------------------------------------------------------
# Unknown cookies are a guest-cache bypass (default deny).
# ---------------------------------------------------------------------------
# Every map below used to bypass the cache for a fixed list of session cookie
# names, and treat every other cookie as harmless.  A plugin's own session or
# an SSO token outside that list therefore rendered a personalised page that
# was then stored for every guest (identity leak), and the same cookie could
# fill the cache with per-visitor entries.  The rule is now inverted: a request
# is cacheable only when every cookie it carries is known to be page-neutral.
#
# The allowlist is deliberately narrow: web-analytics and consent cookies,
# CDN/bot-management cookies, and the first-party guest cookies the supported
# applications set without personalising the response (WordPress's
# wordpress_test_cookie/comment-author cookies, XenForo's CSRF and the style
# and language cookies that are already part of the cache key).  A language
# selector (WPML, Polylang) is NOT neutral: it changes the page, so it keeps
# bypassing until it joins the cache key.  A cookie this list has never seen
# bypasses, which is the safe direction.
#
# One alternation, one PCRE call per request, and no regex at all for the
# common "no Cookie header" (exact match) case.  A site that needs another
# neutral cookie adds its name to the alternation in this file (the nginx
# repository is the source of truth for every host).
map $http_cookie $guest_cookie_unlisted {
    default 0;
    ""      0;
    # A control character other than TAB (\v, \f, CR, LF, DEL, ...) never comes
    # from a browser, but PHP strips the isspace() set (\v, \f) in front of a
    # cookie name while the name check below and nginx's $cookie_* lookup skip
    # only space and TAB: "_ga=1;\vxf_language_id=2" reached PHP as a language
    # cookie under the default cache key, and "\vsso=..." as an unseen
    # login cookie.  Such a header is unlisted (bypass, never stored).
    "~[\x00-\x08\x0a-\x1f\x7f]" 1;
    # not (neutral-name '=' | neutral-prefix) as the whole cookie name
    "~(?:^|;)[ \t]*(?!(?:(?:_ga|_gid|_gat|_gcl_au|_gcl_aw|_gcl_dc|_fbp|_fbc|_ttp|_pin_unauth|hubspotutk|OptanonConsent|OptanonAlertBoxClosed|eupubconsent|CookieConsent|cc_cookie|moove_gdpr_popup|borlabs-cookie|__cf_bm|cf_clearance|_cfuvid|__cflb|ak_bmsc|bm_sv|_abck|wordpress_test_cookie|wp_lang|xf_csrf|xf_style_id|xf_style_variation|xf_language_id)=|(?:_ga_|_gcl_|_hj|_pk_id|_pk_ses|_pk_ref|_pk_cvar|_clck|_clsk|_uetsid|_uetvid|ajs_|mp_|amplitude_|intercom-|__hs|cmplz_|complianz|wpconsent|cookieyes|cky-|_iub_cs|cf_chl_|incap_ses_|visid_incap_|AWSALB|wp-settings-|comment_author)))[^=;\s][^=;]*=" 1;
}

# A XenForo session, login or two-step cookie: the visitor is not a guest.
# No Cookie header at all is an exact (hash) match and runs no regex; the
# four cookie names are one alternation.
# PHP turns ".", " " and "[" in a cookie name into "_", so "xf.session=<sid>"
# reaches XenForo as $_COOKIE['xf_session'] and renders the member's page,
# which a literal xf_session= test stored for every guest (reproduced on the
# 1.21.58 audit host).  Any separator PHP folds counts.  A cookie name holding
# a percent sign also bypasses, as a margin against a decoding layer in front
# of PHP (the same rule in every application's cookie map; real clients never
# encode a name).
# The prefix is not part of the test: a forum with $config['cookie']['prefix']
# (forum_session, forum_user) is covered the same way.
map $http_cookie $xf_guest_cookie {
    default 0;
    ""      0;
    "~*[._ \[](?:session(?:[._ \[]admin)?|user|tfa[._ \[]trust)=" 1;
    "~(?:^|;)\s*[^=;]*%[^=;]*=" 1;
    # A style/language cookie whose VALUE the cache key cannot read.  PHP
    # URL-decodes cookie values ("%32" -> "2", "+2" -> " 2", which XenForo
    # casts to 2) while nginx's $cookie_* keeps the raw bytes, so such a value
    # fell through to the default key below and stored, e.g., a language-2
    # page for every guest.  Any byte outside the key's own character class
    # (digits; [A-Za-z0-9_-] for the variation) keeps the request uncached.
    # Folded or re-cased names (xf.language_id) are unlisted already.
    "~(?:^|;)[ \t]*xf_(?:style_id|language_id)=[^;]*[^0-9;]" 1;
    "~(?:^|;)[ \t]*xf_style_variation=[^;]*[^A-Za-z0-9_;-]" 1;
}

# 1 when h5bp/php_xf.conf may answer from the guest cache: GET/HEAD, no
# session/login cookie, cacheable URI, no API key or Authorization header
# ($nocacheuri covers both).  Everything else stays in the uncached PHP
# location and keeps its Set-Cookie headers.
# Cache-key tokens.  XenForo renders a guest page per style, style variation
# and language, all chosen by cookies the visitor controls.  Only a
# well-formed value enters the key, so a forged cookie can neither overwrite
# another URL's entry nor grow the cache without bound through free-form
# values.  A value with bytes outside the key's class is never cached
# ($xf_guest_cookie above): PHP decodes cookie values, so "%32" would render
# language 2 under the default key.  A well-formed value naming no existing
# style or language renders the default page and shares its entry.
# An absent cookie (the usual guest) is an exact match: no regex runs.
map $cookie_xf_style_variation $xf_key_variation {
    default "";
    ""      "";
    "~^[A-Za-z0-9_-]{1,32}$" $cookie_xf_style_variation;
}
map $cookie_xf_style_id $xf_key_style {
    default "";
    ""      "";
    "~^[0-9]{1,6}$" $cookie_xf_style_id;
}
map $cookie_xf_language_id $xf_key_language {
    default "";
    ""      "";
    "~^[0-9]{1,6}$" $cookie_xf_language_id;
}
# The stored body differs by encoding: XenForo gzips its own output, and
# WordPress/Chevereto do when PHP compresses for their document root
# (zlib.output_compression; setup.sh writes that per root).  A page stored
# compressed is sent as is, about 0.1 ms of CPU per hit instead of 1 ms to
# compress it again on every hit.  Two variants only: gzip or plain; a client
# without gzip gets the plain entry, compressed on the fly as before.
map $http_accept_encoding $guest_cache_enc {
    default "";
    # The headers current browsers, curl and CDNs send are exact (hash)
    # matches, so the usual request runs no regex; anything else falls
    # through to the pattern below with the same result.
    ""                        "";
    "gzip"                    gzip;
    "gzip, deflate"           gzip;
    "gzip, deflate, br"       gzip;
    "gzip, deflate, br, zstd" gzip;
    "deflate, gzip"           gzip;
    "deflate, gzip, br"       gzip;
    "deflate, gzip, br, zstd" gzip;
    "br"                      "";
    "identity"                "";
    # Match the gzip token only when it has no q-value.  The old ~*gzip also
    # matched "gzip;q=0" (a client explicitly refusing gzip) and served it a
    # stored gzip body; a positive q-value now falls back to the identity
    # entry, which is always acceptable to that client.
    "~*(?:^|,)\s*gzip\s*(?:,|$)"  gzip;
}

# The Accept-Encoding the application is given where the guest cache stores
# pages: exactly the key's encoding, "gzip" or nothing.  The caches ignore
# the response's Vary (fastcgi_ignore_headers Vary): with Vary honoured, nginx
# kept one entry per exact client header, so Chrome ("gzip, deflate, br,
# zstd"), Safari ("gzip, deflate, br") and Cloudflare ("br, gzip") each
# filled their own copy of every page (three entries for one XenForo thread
# on the 1.21.59 audit host) although all three get the same gzip body.
# Ignoring Vary is safe only because the body now follows the key alone:
# XenForo gzips when the header contains "gzip", PHP's zlib.output_compression
# picks gzip first and "deflate" otherwise, so "deflate" or "gzip;q=0" (plain
# key) are given nothing and answered plain.  Vary is still sent to clients.
map $guest_cache_enc $guest_cache_ae {
    gzip    gzip;
    default "";
}

# Ignoring Vary covers every header it names, not only Accept-Encoding.  A
# response that varies on anything else (a WordPress mobile plugin's
# "Vary: User-Agent", a "Vary: Cookie") is therefore not stored at all: with
# Vary honoured it was stored per exact header, now it would be one entry for
# everybody.  Every guest cache lists this variable in its *_no_cache line.
# The three applications measured send "Vary: Accept-Encoding" only.
map $upstream_http_vary $guest_cache_vary_other {
    default                       1;
    ""                            0;
    "Accept-Encoding"             0;   # map strings match case-insensitively
    "~*^\s*accept-encoding\s*$"   0;
}

# Storage-time check that the body matches the key, whichever location
# rendered it: a PHP location that does not pass $guest_cache_ae (a
# WordPress subdirectory install served by h5bp/php.conf, a hand-written
# location) still gets the client's raw header, and PHP would answer
# "deflate" or "gzip;q=0" with a compressed body under the plain key.  Such a
# response is not stored.  A plain body under the gzip key is fine: every
# client accepts it, and nginx compresses it on the way out.
map "$guest_cache_enc:$upstream_http_content_encoding" $guest_cache_enc_mismatch {
    default     1;
    ":"         0;
    "gzip:gzip" 0;
    "gzip:"     0;
}

# The same for the XenForo proxy cache (h5bp/xf_proxy_pass.conf), where the
# origin's own nginx may compress too: a cacheable guest request is given the
# key's encoding; a member (never stored) keeps its header, so the origin can
# still answer it with Brotli.
map "$xf_guest_cookie:$nocacheuri:$guest_cache_enc" $xf_proxy_ae {
    default     $http_accept_encoding;
    "0:0:gzip"  gzip;
    "0:0:"      "";
}

map "$guest_cache_method:$xf_guest_cookie:$nocacheuri:$guest_cookie_unlisted" $xf_guest_cacheable {
    default 0;
    "1:0:0:0" 1;
}

fastcgi_cache_path /home/nginx_cache levels=1:2 keys_zone=fastcgicache:256m max_size=16g inactive=1h min_free=512m use_temp_path=off;
