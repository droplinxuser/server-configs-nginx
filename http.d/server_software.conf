# SERVER_SOFTWARE for PHP: fastcgi.conf and fastcgi_params pass this value.
#
# "nginx" on every request, "nginx/<version>" on admin.php only.  XenForo's
# admin Server environment report shows the server line only in the
# name/version form (XF\Util\Php matches ^(.+/[\d.]+)), so each host's nginx
# version can be read there; public pages, phpinfo() output of other
# scripts and application error reports keep the bare name.  WordPress still
# detects nginx ($is_nginx matches "nginx" in either form; got_url_rewrite()
# depends on it).  The value goes to PHP over FastCGI only, never to
# clients, and nginx evaluates the map only for a request it passes to PHP
# (not on a guest-cache hit).
map $uri $fastcgi_server_software {
    default                 nginx;
    "~(?:^|/)admin\.php$"   nginx/$nginx_version;
}
