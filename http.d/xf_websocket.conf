map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

upstream xf_websocket {
    zone xf_ws_zone 256k;
    server 127.0.0.1:2020;
    keepalive_requests 65536;
    keepalive_timeout      1h;
    keepalive_time         1h;
}

# Soketi (Pusher protocol) listener behind the ws-soket.example.com and
# soketi.example.net vhosts.  Keep it in the shared tree: Angie resolves
# upstream names while loading the configuration, so a redeploy that dropped
# this block while the vhost still says `proxy_pass http://xf_websocket_so`
# would make `angie -t` fail with "host not found in upstream".
upstream xf_websocket_so {
    zone xf_ws_so_zone 256k;
    server 127.0.0.1:6001;
    keepalive_requests 131072;
    keepalive_timeout      1h;
    keepalive_time         1h;
}
