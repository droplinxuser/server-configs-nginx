### Proxy Cache ###
# $xf_proxy_cacheuri is kept for vhosts that still reference it; it is the
# shared XenForo no-cache decision from http.d/fastcgi_cache.conf.
map $nocacheuri $xf_proxy_cacheuri {
    default 1;
    0       0;
}

proxy_cache_path /home/xf_proxy_cache levels=1:2 keys_zone=xfproxycache:256m max_size=16g inactive=1h use_temp_path=off;
