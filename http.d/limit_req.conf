### Per-IP request limiting
#
# Loopback is exempt so health checks, local load tests and a local reverse
# proxy are not throttled.  External clients get generous but bounded rates.
# If all traffic arrives through Cloudflare/CDN, configure real_ip first
# (see cloudflare.sh) or every visitor will share one key.

geo $limit_req_whitelist {
    default 0;
    127.0.0.0/8 1;
    ::1/128     1;
}

map $limit_req_whitelist $limit_req_key {
    default $binary_remote_addr;
    1       "";
}

# The credential limiter must not inherit the generic whitelist.  That
# whitelist is also where setup.sh writes SETUP_LIMIT_REQ_EXEMPT (a load
# generator or a reverse proxy), and emptying the login key for such an
# address removes brute-force protection for every request that arrives from
# it: a persisted benchmark exemption silently left logins unthrottled (16/16
# POSTs to wp-login.php answered 200 where the tenth should have been 429).
# Loopback stays exempt here as well: local health checks and the functional
# suites log in repeatedly, and a local account can already reach PHP-FPM
# directly.  A trusted proxy must configure real_ip (cloudflare.sh or
# set_real_ip_from) so $binary_remote_addr is the visitor, not the proxy.
geo $login_req_whitelist {
    default 0;
    127.0.0.0/8 1;
    ::1/128     1;
}

map $login_req_whitelist $limit_req_login_key {
    default $binary_remote_addr;
    1       "";
}

### Map GET, POST & HEAD method
map $request_method $req_post_head_method {
    default $limit_req_key;
    GET "";
}
map $request_method $req_get_https_method {
    GET $limit_req_key;
    default "";
}

# Credential endpoints: WordPress, XenForo, Chevereto and Flarum logins,
# registration and password resets.  Only the form submission (POST) counts.
# The XenForo upgrader has its own login form (/install/index.php?upgrade/
# login); it is a full administrator credential prompt that does not pass
# through the ACP, so it needs the same limit or it is an unthrottled
# brute-force surface next to the throttled /login.
#
# The key uses $uri (the decoded, normalised path), not $request_uri: nginx
# routes by $uri, so "POST /%77p-login.php" reaches wp-login.php while a
# $request_uri map would see only the encoded spelling and skip the limiter.
# $is_args$args keeps the query-string routes (index.php?login/...).
#
# Every alternative allows a directory prefix (".*/"): a WordPress install in
# /blog/ or a board in /forum/ used to fall through to the generic 30r/s POST
# zone, a 90x weakening of the credential limit.  ".*/" still matches the
# document root because ".*" may be empty.
#
# $args is raw while PHP decodes it, so "index.php?%6cogin/login" reaches the
# login controller with a key no keyword matches.  Any percent-encoded query
# on the two front controllers is therefore counted by the credential zone as
# well: a form submit never needs it, while a route always can be spelled that
# way.  Encoded path segments are already covered because $uri is decoded.
map "$request_method:$uri$is_args$args" $req_login_key_uri {
    default "";
    "~*^POST:.*/(?:wp-login\.php|xmlrpc\.php)(?:[/?]|$)" $limit_req_login_key;
    "~*^POST:.*/admin\.php\?/*login" $limit_req_login_key;
    "~*^POST:.*/install/index\.php\?/*upgrade/login" $limit_req_login_key;
    "~*^POST:.*/(?:index|admin)\.php\?[^ ]*%" $limit_req_login_key;
    "~*^POST:.*/(?:index\.php)?/*\??/*(?:login|lost-password|register|signup|account/password-forgot|api/(?:token|forgot|v2/login)|api/login)(?:[/?&]|$)" $limit_req_login_key;
}

# The limit runs in the PHP location, after try_files has rewritten $uri to
# /index.php.  XenForo carries the route into the arguments (?$uri&$args);
# Chevereto ($is_args$query_string) and Flarum (?$query_string) do not, so
# their POST /login, /signup, /account/password-forgot and /api/token keyed
# as "POST:/index.php" and only met the 30 r/s POST zone (30 Chevereto login
# POSTs in a row: no 429).  The route list is therefore also matched against
# the request line as sent.
map "$request_method:$request_uri" $req_login_key_raw {
    default "";
    "~*^POST:.*/(?:index\.php)?/*\??/*(?:login|lost-password|register|signup|account/password-forgot|api/(?:token|forgot|v2/login)|api/login)(?:[/?&]|$)" $limit_req_login_key;
}

# Either match puts the request in the credential zone, under one key.
map "$req_login_key_uri:$req_login_key_raw" $req_login_key_post {
    ":"     "";
    default $limit_req_login_key;
}

# Only a POST can be a credential submission.  The method is an exact (hash)
# lookup, so a GET -- every page view and every guest-cache hit -- never
# evaluates the six regular expressions above; maps are lazy, and
# $req_login_key_post is only read for a POST.
map $request_method $req_login_key {
    POST    $req_login_key_post;
    default "";
}

limit_req_zone $req_post_head_method zone=limit_req_post_head:32m rate=30r/s;
limit_req_zone $req_get_https_method zone=limit_req_get_perip:64m rate=100r/s;
# 20 attempts a minute per address after a burst of 10 (see h5bp/limit_req).
limit_req_zone $req_login_key zone=limit_req_login:16m rate=20r/m;
limit_req_status 429;
limit_req_log_level warn;
