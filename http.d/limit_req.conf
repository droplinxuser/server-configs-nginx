### Per-IP request limiting
#
# Loopback is exempt so health checks, local load tests and a local reverse
# proxy are not throttled.  External clients get generous but bounded rates.
# If all traffic arrives through Cloudflare/CDN, configure real_ip first
# (see cloudflare.sh) or every visitor will share one key.

geo $limit_req_whitelist {
    default 0;
    127.0.0.0/8 1;
    ::1/128     1;
}

map $limit_req_whitelist $limit_req_key {
    default $binary_remote_addr;
    1       "";
}

### Map GET, POST & HEAD method
map $request_method $req_post_head_method {
    default $limit_req_key;
    GET "";
}
map $request_method $req_get_https_method {
    GET $limit_req_key;
    default "";
}

# Credential endpoints: WordPress, XenForo, Chevereto and Flarum logins,
# registration and password resets.  Only the form submission (POST) counts.
map "$request_method:$request_uri" $req_login_key {
    default "";
    "~*^POST:/+(?:wp-login\.php|xmlrpc\.php)(?:[/?]|$)" $limit_req_key;
    "~*^POST:/+admin\.php\?/*login" $limit_req_key;
    "~*^POST:/+(?:index\.php)?/*\??/*(?:login|lost-password|register|signup|account/password-forgot|api/token|api/forgot)(?:[/?&]|$)" $limit_req_key;
}

limit_req_zone $req_post_head_method zone=limit_req_post_head:32m rate=30r/s;
limit_req_zone $req_get_https_method zone=limit_req_get_perip:64m rate=100r/s;
# 20 attempts a minute per address after a burst of 10 (see h5bp/limit_req).
limit_req_zone $req_login_key zone=limit_req_login:16m rate=20r/m;
limit_req_status 429;
limit_req_log_level warn;
