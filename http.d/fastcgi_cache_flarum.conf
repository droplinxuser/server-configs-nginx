### Flarum guest cache (h5bp/php_flarum.conf) ###
# URIs the guest cache never stores: the JSON API, the admin panel and every
# authentication/account route.  $request_uri is the raw request line, so
# the patterns are case-insensitive and tolerate repeated slashes.
map $request_uri $flarum_nocache_uri {
    default 0;
    ~*^/+(?:api|admin|login|logout|register|confirm|reset|settings|notifications|flags|auth)(?:[/?]|$) 1;
}

# A Flarum session (flarum_session is set for every browser visit and carries
# the CSRF token embedded in the page) or a "remember me" login.  Such a
# visitor is rendered by PHP; only cookie-less clients share the cache.
map $http_cookie $flarum_guest_cookie {
    default 0;
    ~*flarum_session=  1;
    ~*flarum_remember= 1;
}

# 1 when h5bp/php_flarum.conf may answer from the guest cache: GET/HEAD
# ($guest_cache_method, http.d/fastcgi_cache.conf), no Flarum cookie, a
# cacheable URI and no Authorization header (API token).
map "$guest_cache_method:$flarum_guest_cookie:$flarum_nocache_uri:$http_authorization" $flarum_guest_cacheable {
    default 0;
    "1:0:0:" 1;
}
