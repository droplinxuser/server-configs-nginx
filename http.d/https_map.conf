# ----------------------------------------------------------------------
# | PHP HTTPS flag behind a TLS terminator                              |
# ----------------------------------------------------------------------
# When Angie terminates TLS itself, $https is "on" and fastcgi.conf already
# passes it.  Behind a TLS terminator or reverse proxy (a CDN, a Cloudflare
# tunnel, a local load balancer) the application leg is plain HTTP, $https is
# empty, and PHP would believe the request is insecure: is_ssl() false,
# secure cookies not set, http:// URLs and redirect loops.
#
# Rebuild the flag from X-Forwarded-Proto, but only for a trusted peer: a
# local terminator connects over loopback.  A client that reaches the origin
# directly on port 80 can no longer make PHP believe it is on HTTPS by
# sending the header itself (that made WordPress emit https:// links and
# Secure cookies over plaintext).
#
# A TLS terminator on another host (CDN, load balancer) is declared in
# custom.d/https_trusted_peers.map, one peer per line and the same key shape:
#
#   203.0.113.10:https   on;
#   2001:db8::10:https   on;
#
# The file is not touched by a deploy and the bracket makes the include a
# glob, so a missing file is not an error.  The map is always defined so
# snippets/fastcgi-php.conf can reference $app_https on every host, including
# one that does not run a proxy at all (default = $https).
map "$realip_remote_addr:$http_x_forwarded_proto" $app_https {
    default $https;
    include custom.d/https_trusted_peers[.]map;
    "127.0.0.1:https" on;
    "[::1]:https"     on;
}

# The matching scheme string for REQUEST_SCHEME.  fastcgi.conf's $scheme is
# "http" on the Unix-socket application leg even when the visitor is on
# HTTPS; applications that build absolute URLs from REQUEST_SCHEME would then
# emit http:// links and redirect loops.
map $app_https $app_scheme {
    default http;
    on      https;
}

# A proxy's forwarded headers are trusted only when the direct peer is one.
# A visitor that reaches the origin itself could otherwise make PHP see a
# different client address, scheme or host (cache poisoning, IP allowlists
# and audit logs).  A local terminator connects over loopback; anything else
# is declared in custom.d/trusted_proxies.map with the same key shape (one
# peer per line, e.g. "203.0.113.10 1;").
map "$realip_remote_addr" $trusted_forwarder {
    default 0;
    "127.0.0.1" 1;
    "[::1]"   1;
    include custom.d/trusted_proxies[.]map;
}

# The client address PHP sees: the trusted proxy's header, or the direct
# peer.  $remote_addr (not $realip_remote_addr) is the visitor when
# real_ip/Cloudflare runs, and the direct peer otherwise.
map "$trusted_forwarder:$http_x_real_ip" $php_x_real_ip {
    default $remote_addr;
    "1:"    $remote_addr;
    "~^1:.+$" $http_x_real_ip;
}
map "$trusted_forwarder:$http_x_forwarded_for" $php_x_forwarded_for {
    default $remote_addr;
    "1:"    $remote_addr;
    "~^1:.+$" $http_x_forwarded_for;
}
