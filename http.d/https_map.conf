# ----------------------------------------------------------------------
# | PHP HTTPS flag behind a TLS terminator                              |
# ----------------------------------------------------------------------
# When Angie terminates TLS itself, $https is "on" and fastcgi.conf already
# passes it.  Behind a TLS terminator or reverse proxy (Anubis, a CDN, a load
# balancer) the application leg is plain HTTP, $https is empty, and PHP would
# believe the request is insecure: is_ssl() is false, secure cookies are not
# set and some applications emit http:// URLs or redirect loops.
#
# Rebuild the flag from the forwarded scheme.  The map is always defined so
# snippets/fastcgi-php.conf can reference $app_https on every host, including
# one that does not run a proxy at all (default = $https).
map $http_x_forwarded_proto $app_https {
    default $https;
    https   on;
}
