# ----------------------------------------------------------------------
# | WordPress guest-cache bypass map                                   |
# ----------------------------------------------------------------------
# Angie only allows `map` in the http context, so the WordPress cache
# decision is assembled here and consumed by h5bp/wordpress_cache.conf.
#
# A request bypasses the guest cache when any one of these is true:
#   * the method is not GET/HEAD
#   * a login, password, comment, shop or PHP session cookie is present
#   * an Authorization header (application passwords, OAuth, HTTP auth) or
#     an X-WP-Nonce header (cookie-authenticated REST call) is present
#   * the URI is wp-admin, wp-login, wp-cron, the REST API (/wp-json or
#     ?rest_route=), XML-RPC, feeds, previews, cart, checkout, or account
#     pages
#
# URI prefixes are case-insensitive and accept repeated slashes ("//wp-json/"):
# $request_uri is the raw request line, while WordPress routes the
# normalised path.
#
# The intermediate maps are 0/1 flags; the final map ORs them without any
# `if` blocks inside a server/location.

map $request_method $wp_cache_bypass_method {
    default 0;
    ~^(POST|PUT|DELETE|PATCH)$ 1;
}

map $http_cookie $wp_cache_bypass_cookie {
    default 0;
    ~*wordpress_logged_in         1;
    ~*wordpress_sec               1;
    ~*wp-postpass                 1;
    ~*comment_author              1;
    ~*woocommerce_items_in_cart   1;
    ~*woocommerce_cart_hash       1;
    ~*wp_woocommerce_session      1;
    ~*edd_items_in_cart           1;
    ~*PHPSESSID                   1;
}

map "$http_authorization$http_x_wp_nonce" $wp_cache_bypass_authorization {
    ""      0;
    default 1;
}

map $request_uri $wp_cache_bypass_uri {
    default 0;
    ~*^/+wp-admin                 1;
    ~*^/+wp-login                 1;
    ~*^/+wp-cron                  1;
    ~*^/+wp-json                  1;
    ~*^/+xmlrpc\.php              1;
    ~*^/+wp-comments-post\.php    1;
    ~*^/+wp-signup\.php           1;
    ~*^/+wp-activate\.php         1;
    ~*^/+feed                    1;
    ~*^/+sitemap                 1;
    ~*^/+preview                 1;
    ~*^/+cart                    1;
    ~*^/+checkout                1;
    ~*^/+my-account              1;
    # Plain-permalink form of the REST API: /?rest_route=/wp/v2/...
    ~*[?&]rest_route=           1;
}

map "$wp_cache_bypass_method:$wp_cache_bypass_cookie:$wp_cache_bypass_authorization:$wp_cache_bypass_uri" $skip_cache {
    default 0;
    ~1      1;
}
