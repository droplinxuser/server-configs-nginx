# ----------------------------------------------------------------------
# | WordPress guest-cache bypass map                                   |
# ----------------------------------------------------------------------
# Angie only allows `map` in the http context, so the WordPress cache
# decision is assembled here and consumed by h5bp/wordpress_cache.conf.
#
# A request bypasses the guest cache when any one of these is true:
#   * the method is POST
#   * a WordPress login/password/comment cookie is present
#   * the URI is wp-admin, wp-login, wp-cron or wp-json
#
# The three intermediate maps are 0/1 flags; the final map ORs them without
# any `if` blocks inside a server/location.

map $request_method $wp_cache_bypass_method {
    default 0;
    POST    1;
}

map $http_cookie $wp_cache_bypass_cookie {
    default 0;
    ~*wordpress_logged_in 1;
    ~*wp-postpass         1;
    ~*comment_author      1;
}

map $request_uri $wp_cache_bypass_uri {
    default 0;
    ~*^/wp-admin  1;
    ~*^/wp-login  1;
    ~*^/wp-cron   1;
    ~*^/wp-json   1;
}

map "$wp_cache_bypass_method:$wp_cache_bypass_cookie:$wp_cache_bypass_uri" $skip_cache {
    default 0;
    ~1      1;
}
