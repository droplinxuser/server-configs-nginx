# ----------------------------------------------------------------------
# | WordPress guest-cache bypass map                                   |
# ----------------------------------------------------------------------
# Angie only allows `map` in the http context, so the WordPress cache
# decision is assembled here and consumed by h5bp/wordpress_cache.conf.
#
# A request bypasses the guest cache when any one of these is true:
#   * the method is not GET/HEAD
#   * a login, password, comment, shop or PHP session cookie is present
#   * an Authorization header (application passwords, OAuth, HTTP auth) or
#     an X-WP-Nonce header (cookie-authenticated REST call) is present
#   * the URI is wp-admin, wp-login, wp-cron, the REST API (/wp-json or
#     ?rest_route=), XML-RPC, feeds, previews, cart, checkout, or account
#     pages
#
# URI prefixes are case-insensitive and accept repeated slashes ("//wp-json/").
# The map reads $request_uri, not $uri: try_files rewrites every pretty URL
# to /index.php, so $uri no longer contains the path that decides the bypass.
# Prefixes are matched at a path-segment boundary so a WordPress install in a
# subdirectory ("/blog/wp-admin/") is covered too.  (The brute-force limiter
# in http.d/limit_req.conf does use the decoded $uri; it runs on requests that
# reach the PHP location directly, and that closed an encoded-path bypass.)
#
# The intermediate maps are 0/1 flags; the final map ORs them without any
# `if` blocks inside a server/location.
#
# Each map runs at most one regular expression.  nginx tries a map's regexes
# in order until one matches, so an ordinary guest page (which matches none)
# used to pay 9 cookie, 15 URI and 2 more PCRE calls on every cache hit; the
# patterns are now alternations that accept exactly the same input, and the
# common values (no cookie, the methods, the all-zero flag string) are exact
# hash lookups that run no regex at all.

map $request_method $wp_cache_bypass_method {
    default 0;
    POST    1;
    PUT     1;
    DELETE  1;
    PATCH   1;
}

map $http_cookie $wp_cache_bypass_cookie {
    default 0;
    ""      0;
    "~*wordpress_logged_in|wordpress_sec|wp-postpass|comment_author|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session|edd_items_in_cart|PHPSESSID" 1;
}

map "$http_authorization$http_x_wp_nonce" $wp_cache_bypass_authorization {
    ""      0;
    default 1;
}

# wp-admin, wp-login(.php), wp-cron.php, wp-json, xmlrpc.php,
# wp-comments-post.php, wp-signup.php, wp-activate.php, feed, (wp-)sitemap,
# preview, cart, checkout and my-account at a path boundary, plus the
# plain-permalink REST API form /?rest_route=/wp/v2/...
map $request_uri $wp_cache_bypass_uri {
    default 0;
    "~*(?:^|/)(?:wp-admin(?:/|$)|wp-login(?:\.php)?(?:[/?]|$)|(?:wp-cron|xmlrpc|wp-comments-post|wp-signup|wp-activate)\.php(?:[/?]|$)|wp-json(?:[/?]|$)|(?:feed|preview|cart|checkout|my-account)(?:/|$)|(?:wp-)?sitemap(?:[-_.]|$))|[?&]rest_route=" 1;
}

# Every flag is 0 or 1, so "any flag set" is "not all four zero": one exact
# match instead of a regex.
map "$wp_cache_bypass_method:$wp_cache_bypass_cookie:$wp_cache_bypass_authorization:$wp_cache_bypass_uri" $skip_cache {
    default   1;
    "0:0:0:0" 0;
}
