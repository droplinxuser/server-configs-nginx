# 1 when the path part of the raw request line carries a "." or ".." segment
# (plain or %2e-encoded); see h5bp/location/security_dot_segments.conf.  A
# map is evaluated once per request and its value is reused when the
# server-rewrite phase runs again after a try_files internal redirect, so the
# check costs one PCRE call instead of two.  Cloudflare forwards raw dot
# segments unless "Normalize URLs to origin" is on.
map $request_uri $bad_dot_segment {
    default 0;
    "~*^[^?]*/(?:\.|%2e){1,2}(?:[/?]|%2f|%5c|$)" 1;
}
