### Host name handed to PHP ###
# The guest caches key on $host: the host Angie validated, lower-cased and
# without a port.  PHP used to receive the raw Host header as HTTP_HOST, so
# the two could disagree.  "Host: example.com:8443" on port 443 shares the
# cache entry of "Host: example.com", but WordPress answered it with a 301
# to the canonical URL (the URL being requested, so normal visitors then got
# a cached redirect to themselves) and XenForo rendered the page with
# https://example.com:8443/ as its base URL; either response was then served
# to every guest for the lifetime of the entry.
#
# snippets/fastcgi-php.conf passes $php_http_host as HTTP_HOST instead.  The
# header is used only when it is exactly $host or "$host:<public port>", and
# the second form only when that port is not 80 or 443 (a vhost that really
# is reached on a non-default port keeps its port).  Any other value, an
# empty one included (HTTP/1.0, or HTTP/3 where only :authority is sent),
# becomes $host.  What PHP sees is therefore always a function of the cache
# key.
#
# A default port is never passed through: "Host: example.com:443" on the 443
# listener is a legal spelling of the same site, but WordPress compares the
# port with home_url and would answer it with the same cacheable 301.
#
# The public port is the port Angie accepted the connection on, unless the
# site is declared in custom.d/php_public_port.map.  Behind a port forward
# that changes the port (NAT, Docker or a load balancer: public 8443 -> local
# 443) clients legitimately send "Host: example.com:8443" and the
# application's canonical URL contains that port, so declare it, one line per
# host name, lower case:
#
#   example.com      8443;
#   www.example.com  8443;
#
# The same file serves the opposite case (public 443 -> local 8080): declare
# 443 and no port is ever passed.  custom.d is not touched by a deploy, and
# the bracket makes the include a glob, so a missing file is not an error.
map $host $php_public_port {
    default $server_port;
    include custom.d/php_public_port[.]map;
}

# "$host:<public port>", or $host alone for the default ports.
map $php_public_port $php_host_port {
    default "$host:$php_public_port";
    80      $host;
    443     $host;
}

# The three parts are joined with "|" and compared with a back-reference.
# Neither captured part can contain "|", so the pattern only matches when the
# whole string has exactly two of them, i.e. when neither $host nor the
# header contains one; a header with a "|" in it falls through to $host.
map "$host|$php_host_port|$http_host" $php_http_host {
    default $host;
    "~^([^|]+)\|([^|]+)\|(?:\1|\2)$" $http_host;
}
