# ----------------------------------------------------------------------
# | Guest-cache key URI without tracking parameters                     |
# ----------------------------------------------------------------------
# $cache_request_uri is $request_uri with marketing/click-tracking query
# parameters removed (utm_*, fbclid, gclid, msclkid, ...).  Only the guest
# cache keys use it (h5bp/wordpress_cache.conf, php_xf.conf,
# php_xf_proxy.conf, php_chev_cache.conf, php_flarum.conf); PHP still
# receives the original REQUEST_URI.  A shared link such as
# /threads/x.1/?utm_source=facebook&fbclid=... is then answered from the
# same entry as /threads/x.1/ instead of rendering, and storing, a copy per
# campaign click (with fastcgi_cache_min_uses 2 such one-off URLs were
# almost never cached at all).
#
# A request that carries a tracking parameter is answered from the clean
# entry but never stores one ($cache_uri_tracking is in every
# fastcgi_no_cache): an application redirect or page that echoes the
# parameters (WordPress redirect_canonical keeps the query) must not be
# stored under the clean URL for every guest.
#
# Cost on the cached path: a request without a query string is an exact
# match on "$is_args" and runs no regex; a query string runs one gate regex;
# only a query that really carries a tracking parameter runs the strip chain.
# $args cannot be used: try_files rewrites it ("/index.php?$uri&$args" for
# XenForo), so the query is taken from the original $request_uri.
#
# The parameter list (case-insensitive, with or without a value):
#   utm_*, fbclid, gclid, gclsrc, gbraid, wbraid, dclid, msclkid, mc_cid,
#   mc_eid, _ga, _gl, igshid, yclid, ttclid, twclid, li_fat_id, srsltid

map $is_args $cache_request_uri {
    ""      $request_uri;
    default $cache_request_uri_q;
}

# 1 when the original query string carries a tracking parameter.
map $request_uri $cache_uri_tracking {
    default 0;
    "~*\?(?:[^#]*&)?(?:utm_[a-z0-9_]+|fbclid|gclid|gclsrc|gbraid|wbraid|dclid|msclkid|mc_cid|mc_eid|_ga|_gl|igshid|yclid|ttclid|twclid|li_fat_id|srsltid)(?:[=&]|$)" 1;
}

map $cache_uri_tracking $cache_request_uri_q {
    default $request_uri;
    1       $cache_request_uri_clean;
}

# Path and query of the original request line.
map $request_uri $cache_req_path {
    default $request_uri;
    "~^(?<cache_req_p>[^?]*)\?" $cache_req_p;
}
map $request_uri $cache_req_query {
    default "";
    "~^[^?]*\?(?<cache_req_q>.*)$" $cache_req_q;
}

# Six one-parameter strip stages (a campaign link carries up to five utm_*
# plus one click id).  Each stage removes the first tracking parameter it
# finds: at the start of the query, or after an "&" (the surrounding "&" is
# kept exactly once).  Every named group always participates, so a value
# never refers to an unset capture.
map $cache_req_query $cache_q1 {
    default $cache_req_query;
    "~*^(?:utm_[a-z0-9_]+|fbclid|gclid|gclsrc|gbraid|wbraid|dclid|msclkid|mc_cid|mc_eid|_ga|_gl|igshid|yclid|ttclid|twclid|li_fat_id|srsltid)(?:=[^&]*)?(?:&|$)(?<cache_q1r>.*)$" $cache_q1r;
    "~*^(?<cache_q1a>.*?)&(?:utm_[a-z0-9_]+|fbclid|gclid|gclsrc|gbraid|wbraid|dclid|msclkid|mc_cid|mc_eid|_ga|_gl|igshid|yclid|ttclid|twclid|li_fat_id|srsltid)(?:=[^&]*)?(?<cache_q1b>(?:&.*)?)$" $cache_q1a$cache_q1b;
}
map $cache_q1 $cache_q2 {
    default $cache_q1;
    "~*^(?:utm_[a-z0-9_]+|fbclid|gclid|gclsrc|gbraid|wbraid|dclid|msclkid|mc_cid|mc_eid|_ga|_gl|igshid|yclid|ttclid|twclid|li_fat_id|srsltid)(?:=[^&]*)?(?:&|$)(?<cache_q2r>.*)$" $cache_q2r;
    "~*^(?<cache_q2a>.*?)&(?:utm_[a-z0-9_]+|fbclid|gclid|gclsrc|gbraid|wbraid|dclid|msclkid|mc_cid|mc_eid|_ga|_gl|igshid|yclid|ttclid|twclid|li_fat_id|srsltid)(?:=[^&]*)?(?<cache_q2b>(?:&.*)?)$" $cache_q2a$cache_q2b;
}
map $cache_q2 $cache_q3 {
    default $cache_q2;
    "~*^(?:utm_[a-z0-9_]+|fbclid|gclid|gclsrc|gbraid|wbraid|dclid|msclkid|mc_cid|mc_eid|_ga|_gl|igshid|yclid|ttclid|twclid|li_fat_id|srsltid)(?:=[^&]*)?(?:&|$)(?<cache_q3r>.*)$" $cache_q3r;
    "~*^(?<cache_q3a>.*?)&(?:utm_[a-z0-9_]+|fbclid|gclid|gclsrc|gbraid|wbraid|dclid|msclkid|mc_cid|mc_eid|_ga|_gl|igshid|yclid|ttclid|twclid|li_fat_id|srsltid)(?:=[^&]*)?(?<cache_q3b>(?:&.*)?)$" $cache_q3a$cache_q3b;
}
map $cache_q3 $cache_q4 {
    default $cache_q3;
    "~*^(?:utm_[a-z0-9_]+|fbclid|gclid|gclsrc|gbraid|wbraid|dclid|msclkid|mc_cid|mc_eid|_ga|_gl|igshid|yclid|ttclid|twclid|li_fat_id|srsltid)(?:=[^&]*)?(?:&|$)(?<cache_q4r>.*)$" $cache_q4r;
    "~*^(?<cache_q4a>.*?)&(?:utm_[a-z0-9_]+|fbclid|gclid|gclsrc|gbraid|wbraid|dclid|msclkid|mc_cid|mc_eid|_ga|_gl|igshid|yclid|ttclid|twclid|li_fat_id|srsltid)(?:=[^&]*)?(?<cache_q4b>(?:&.*)?)$" $cache_q4a$cache_q4b;
}
map $cache_q4 $cache_q5 {
    default $cache_q4;
    "~*^(?:utm_[a-z0-9_]+|fbclid|gclid|gclsrc|gbraid|wbraid|dclid|msclkid|mc_cid|mc_eid|_ga|_gl|igshid|yclid|ttclid|twclid|li_fat_id|srsltid)(?:=[^&]*)?(?:&|$)(?<cache_q5r>.*)$" $cache_q5r;
    "~*^(?<cache_q5a>.*?)&(?:utm_[a-z0-9_]+|fbclid|gclid|gclsrc|gbraid|wbraid|dclid|msclkid|mc_cid|mc_eid|_ga|_gl|igshid|yclid|ttclid|twclid|li_fat_id|srsltid)(?:=[^&]*)?(?<cache_q5b>(?:&.*)?)$" $cache_q5a$cache_q5b;
}
map $cache_q5 $cache_q6 {
    default $cache_q5;
    "~*^(?:utm_[a-z0-9_]+|fbclid|gclid|gclsrc|gbraid|wbraid|dclid|msclkid|mc_cid|mc_eid|_ga|_gl|igshid|yclid|ttclid|twclid|li_fat_id|srsltid)(?:=[^&]*)?(?:&|$)(?<cache_q6r>.*)$" $cache_q6r;
    "~*^(?<cache_q6a>.*?)&(?:utm_[a-z0-9_]+|fbclid|gclid|gclsrc|gbraid|wbraid|dclid|msclkid|mc_cid|mc_eid|_ga|_gl|igshid|yclid|ttclid|twclid|li_fat_id|srsltid)(?:=[^&]*)?(?<cache_q6b>(?:&.*)?)$" $cache_q6a$cache_q6b;
}

# Nothing but tracking parameters: key on the bare path, which is the same
# entry as the link without a query string.
map $cache_q6 $cache_request_uri_clean {
    ""      $cache_req_path;
    default $cache_req_path?$cache_q6;
}
