proxy_http_version 1.1;

proxy_buffering off;
#proxy_request_buffering off;
proxy_redirect off;

# Pass the application's own Cache-Control through: the http-level
# `expires $expires` map would stamp max-age=1y on a proxied download.
expires off;

# $php_http_host (http.d/fastcgi_host.conf) is the Host header only when it
# names this vhost on its public port; anything else becomes $host.
proxy_set_header Host                  $php_http_host;
proxy_set_header X-Forwarded-Host      $php_http_host;
proxy_set_header X-Forwarded-Proto     $scheme;
proxy_set_header X-Real-IP             $remote_addr;
proxy_set_header X-Forwarded-Port      $server_port;
proxy_set_header X-Forwarded-For       $proxy_add_x_forwarded_for;
# Replay flag for TLS 1.3 early data (empty unless ssl_early_data is on).
proxy_set_header Early-Data            $ssl_early_data;
proxy_set_header Connection            "";

#proxy_connect_timeout 300s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;
send_timeout          300s;
keepalive_timeout     300s;

proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;
