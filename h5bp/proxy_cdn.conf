add_header X-Cache-Status $upstream_cache_status;
expires max;

proxy_http_version 1.1;

proxy_cache proxy_cdn;
# $host is the client-visible CDN name, always set; $proxy_host is empty when
# proxy_pass uses a variable (the template's $cdn_host is the origin host).
proxy_cache_key "$scheme|$host|$request_method|$uri|$is_args$args";
proxy_cache_lock on;
proxy_cache_methods GET HEAD;
proxy_cache_revalidate on;
# Only real upstream failures may serve a stale object.  A stale 403/404/429
# is an authorization or existence answer, not an outage: replaying it for the
# whole TTL (182 days for a 200) pins a temporary permission error.
proxy_cache_use_stale  error timeout invalid_header updating http_500 http_502 http_503 http_504;

# 200 is the media TTL; a redirect/challenge is not.  301/302/303/404 keep a
# short TTL so a fixed URL recovers the same day.
proxy_cache_valid 200 30d;
proxy_cache_valid 301 302 303 404 1h;
proxy_cache_valid any 1m;

proxy_hide_header Strict-Transport-Security;
# Honour the origin's own policy: a no-store/private response must not be
# frozen at the edge.  Set-Cookie stays ignored because the fetch is
# anonymous (Cookie/Authorization are blanked below) and the response cookie
# is hidden; X-Accel-Expires still lets the origin shorten a TTL.
proxy_ignore_headers Expires Set-Cookie;

# Upstream TLS verification is OFF: origins installed by setup.sh present
# self-signed certificates, and a verifying CDN proxy answers 502 for every
# fetch.  The hop stays encrypted; the cached object is not authenticated.
# Re-enable only when the origin has a publicly trusted certificate
# (Cloudflare Origin CA) and proxy_ssl_name matches it.
proxy_ssl_verify off;
proxy_ssl_verify_depth 2;
proxy_ssl_server_name on;
proxy_ssl_name $cdn_host;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

proxy_redirect off;
proxy_set_header Host              $cdn_host;
proxy_set_header X-Forwarded-For   $proxy_x_forwarded_for;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $php_public_port;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $app_scheme;
proxy_set_header Connection        "";
# The CDN fetches as an anonymous guest: a visitor's cookies or credentials
# must not authorise a private object that is then cached for everyone.
proxy_set_header Cookie            "";
proxy_set_header Authorization     "";
proxy_hide_header Set-Cookie;

proxy_connect_timeout 300s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;
