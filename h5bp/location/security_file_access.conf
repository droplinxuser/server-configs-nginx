# ----------------------------------------------------------------------
# | File access                                                        |
# ----------------------------------------------------------------------

# Block access to all hidden files and directories except for the
# visible content from within the `/.well-known/` hidden directory.
#
# These types of files usually contain user preferences or the preserved state
# of a utility, and can include rather private places like, for example, the
# `.git` or `.svn` directories.
#
# The `/.well-known/` directory represents the standard (RFC 5785) path prefix
# for "well-known locations" (e.g.: `/.well-known/manifest.json`,
# `/.well-known/keybase.txt`), and therefore, access to its visible content
# should not be blocked.
#
# https://www.mnot.net/blog/2010/04/07/well-known
# https://tools.ietf.org/html/rfc5785

# Enabled: a dotfile can hold credentials, editor state, VCS history or an
# application secret (for example wp-content/.analyst_*).  Keep the ACME
# challenge path reachable.
location ~* /\.(?!well-known/) {
  deny all;
}

# Configuration, installer and debug endpoints that must never be public.
# xmlrpc.php is blocked because it is a persistent brute-force and
# pingback-abuse target; re-enable it per vhost only if an app requires it.
location ~* ^/(?:wp-config\.php|readme\.html|license\.txt|xmlrpc\.php|wp-admin/install\.php|wp-trackback\.php|\.env(?:\..*)?|composer\.(?:json|lock)|package(?:-lock)?\.json)$ {
  deny all;
}

# Backup/rollback directories created by common WordPress plugins.  These
# routinely contain full database dumps and site archives; never serve them.
location ~* ^/wp-content/(?:wpvividbackups|aiowps_backups|backup-migration-[^/]+|updraft|backups?|upgrade)/ {
  deny all;
}

# Database dumps and compressed archives left in the document root.
location ~* /[^/]+\.(?:sql|sql\.gz|lz4|dump|bak|old|orig)$ {
  deny all;
}

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

# Block access to files that can expose sensitive information.
#
# By default, block access to backup and source files that may be left by some
# text editors and can pose a security risk when anyone has access to them.
#
# https://feross.org/cmsploit/
#
# (!) Update the `location` regular expression from below to include any files
#     that might end up on your production server and can expose sensitive
#     information about your website. These files may include: configuration
#     files, files that contain metadata about the project (e.g.: project
#     dependencies, build scripts, etc.).

location ~* (?:#.*#|\.(?:bak|conf|dist|fla|in[ci]|log|orig|psd|sh|sql|sw[op])|~)$ {
  internal;
}
