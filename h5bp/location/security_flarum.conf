# ----------------------------------------------------------------------
# | Flarum: every deny rule in one regular expression                   |
# ----------------------------------------------------------------------
# Included by h5bp/php_flarum.conf.  Flarum's public/ ships exactly one
# script, index.php, which `location = /index.php` matches before any regex;
# every other ".php" is a 404 here, so Flarum needs no PHP regex at all.
#   1 403  dotfiles and VCS, PHP source copies, archives in the document
#          root, dumps at any depth, PHP below assets/, composer files
#   2 404  any other .php (and PATH_INFO), logs, shell scripts, config
#          fragments, editor leftovers
location ~* "(?s)^(?:.*?(?:/\.(?!well-known/)|\.php[^/]+$|^/(?!sitemap)[^/]+\.(?:zip|tar|tgz|gz|bz2|xz|zst|7z|rar|wpress|sql)$|\.(?:sql(?:\.(?:gz|bz2|xz|zst|lz4|zip|7z))?|lz4|dump|bak|old|orig)$|/assets/.*\.(?:php$|phtml(?:/|$)|phar(?:/|$))|/composer\.(?:json|lock)$)|.*?(?<flarum_deny_nf>(?-i:\.php(?:/|$))|#.*#$|\.(?:conf|dist|in[ci]|log|sh|sw[op])$|~$))" {
    if ($flarum_deny_nf) { return 404; }
    deny all;
}
