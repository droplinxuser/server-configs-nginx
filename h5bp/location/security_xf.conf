# ----------------------------------------------------------------------
# | XenForo: every deny rule in one regular expression                  |
# ----------------------------------------------------------------------
# Included by h5bp/php_xf.conf ahead of the PHP locations, and nested in the
# ^~ /data/, /js/ and /styles/ blocks of h5bp/xf2.conf (^~ skips the
# server-level regex locations there).  It replaces about twenty regex
# locations (security_backup_files, security_root_archives,
# security_file_access and the XenForo-specific ones): nginx tries regex
# locations in order until one matches, so an ordinary page used to run
# every one of them twice (before and after the try_files redirect).
#
# Tiers keep the old order and status codes; each tier is tried against the
# whole URI before the next one:
#   1 404  PHP below data/js/styles/src/library/internal_data/attachments at
#          any depth (subdirectory boards, vhosts without xf2.conf);
#          uploader accept-lists ("/.jpg,.png")
#   2 403  dotfiles and VCS (/.git, /.env, /.htpasswd; /.well-known/ is
#          allowed), PHP source copies (x.php~, x.php.bak, x.phps), archives
#          in the document root, dumps and stale copies at any depth
#   3 404  PATH_INFO ("/x.php/y"), logs, shell scripts, config fragments,
#          editor leftovers
# (?s): Angie decodes %0A into $uri; without DOTALL the anchored .*? could
# not step past a newline, while the old unanchored rules searched every
# offset.  `return` (rewrite phase) runs before `deny` (access phase), and
# testing a named capture runs no second regex.
location ~* "(?s)^(?:.*?(?<xf_deny_nf1>/(?:data|js|styles|src|library|internal_data|attachments)/.*\.ph(?:p|tml|ar)(?:/|$)|/\.[a-z0-9]+(?:,\.[a-z0-9]+)+$)|.*?(?:/\.(?!well-known/)|\.php[^/]+$|^/(?!sitemap)[^/]+\.(?:zip|tar|tgz|gz|bz2|xz|zst|7z|rar|wpress|sql)$|\.(?:sql(?:\.(?:gz|bz2|xz|zst|lz4|zip|7z))?|lz4|dump|bak|old|orig)$)|.*?(?<xf_deny_nf3>(?-i:\.php/)|#.*#$|\.(?:conf|dist|in[ci]|log|sh|sw[op])$|~$))" {
    if ($xf_deny_nf1) { return 404; }
    if ($xf_deny_nf3) { return 404; }
    deny all;
}
