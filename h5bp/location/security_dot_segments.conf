# Reject path dot-segments before they reach an application.
#
# Angie resolves "." and ".." when it builds $uri/try_files, but FastCGI and
# proxy backends receive the raw request line as REQUEST_URI.  Chevereto's
# front controller treats /foo/../index.php as an invalid setup and answers
# 500 ("Invalid PHP front controller setup"), which fills the error log and
# makes a link with a stray segment look like a server fault.  No legitimate
# client sends a dot-segment (RFC 3986 section 6.2.2.3 says to remove them),
# so answer 400 instead of forwarding a path the backend has to interpret.
#
# The match is limited to the path part: $request_uri still carries the query
# string, and a value such as /?next=./ must keep working.  Percent-encoded
# dots are decoded by Angie before this phase; an encoded separator is
# already rejected by the parser.
if ($request_uri ~ "^[^?]*/\.\.?(?:[/?]|$)") {
  return 400;
}
