# Leftover working files (/install.log, /update.sh, /login.bak, editor
# backups).  For locations that are tried before the server-level
# h5bp/location/security_file_access.conf and would otherwise serve such a
# file through their own try_files.
location ~* (?:#.*#|\.(?:bak|conf|dist|in[ci]|log|old|orig|sh|sql|sw[op])|~)$ {
  deny all;
}
