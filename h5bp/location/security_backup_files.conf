# ----------------------------------------------------------------------
# | Backup copies and hidden PHP                                       |
# ----------------------------------------------------------------------
# Files an editor, an administrator or a backup tool leaves behind.  None of
# them matches the PHP location, so Angie used to serve them as plain
# downloads: /wp-config.php.save, /wp-config.txt and /app/env.php.save
# all answered 200 with the file.  (Archives in the document root are a
# separate include, h5bp/location/security_root_archives.conf, used by the
# application PHP files only.)
#
# This file is included twice on purpose.  Every server-level PHP include
# (h5bp/php.conf, php_wp.conf, php_xf.conf, php_chev.conf,
# php_chev_cache.conf, php_flarum.conf) pulls it in ahead of its PHP
# location, because regex locations are tried in file order and existing
# vhosts include the PHP file before h5bp/basic*.conf: only from there can
# the first rule below win over `location ~ [^/]\.php(/|$)`.  A PHP include
# nested in another location (XenForo /login, /admin.php, Chevereto
# /dashboard) brings the rules along, so a prefix-style regex such as
# ^/(dashboard|update) can not serve /update.sql or /admin.php.bak either.
# h5bp/location/security_file_access.conf includes it again for servers
# without PHP.  Repeating a regex location is harmless: the first one in
# file order answers and the second is never reached.

# PHP below a hidden directory or in a hidden file (/.x.php, /.git/hook.php).
# The dotfile rule in security_file_access.conf comes after the PHP location
# and never saw these; they were executed.  /.well-known/ stays reachable.
location ~* /\.(?!well-known/).*\.php(?:/|$) {
  deny all;
}

# Anything named wp-config*: wp-config.php itself, a bare wp-config,
# wp-config.txt, wp-config.php.save, wp-config-backup.php, wp-config.old.
# The file holds database credentials and the authentication salts in every
# spelling.  The look-ahead spares a pretty permalink, which has the same
# shape as a file name here: /wp-config-explained or /wp-config-tips.html
# (a slug of letters, digits and dashes, with at most an .html suffix).
location ~* /wp-config(?!-[a-z0-9-]+(?:\.html?)?$)[^/]*$ {
  deny all;
}

# A name that continues after ".php": config.php.save, env.php.bak,
# index.php.1, settings.php~, .php.swp, .phps.  It is PHP source that the
# PHP location does not execute, so it would be sent as text.  A request
# with PATH_INFO (/index.php/x) is not affected, and neither is a name that
# merely contains "php" (/js/config.min.js, /env.js, /php-info.css).
location ~* \.php[^/]+$ {
  deny all;
}
