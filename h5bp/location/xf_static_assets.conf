# Long-cache XenForo static assets.  Nested in the ^~ /data/, /js/ and
# /styles/ blocks of h5bp/xf2.conf, after h5bp/location/security_xf.conf
# (it replaces the regex location that setup.sh tune_xf_static_assets used
# to inject at server level).
location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|eot|ico)$ {
    # One Cache-Control header: `expires` would add a second one.
    expires off;
    add_header Cache-Control "public, max-age=2592000, immutable";
    # add_header replaces the inherited header set.
    include h5bp/security/x-content-type-options.conf;
    include h5bp/security/strict-transport-security.conf;
    limit_except GET OPTIONS { deny all; }
    access_log off;
    try_files $uri =404;
}
