# ----------------------------------------------------------------------
# | WordPress: every deny rule in one regular expression                |
# ----------------------------------------------------------------------
# Included by h5bp/php_wp.conf ahead of the PHP locations.  Replaces
# security_backup_files, security_root_archives, the WordPress rules of
# php_wp.conf and security_file_access (see security_xf.conf for why).
#   1 403  dotfiles and VCS, wp-config in every spelling (wp-config.php,
#          .save, .txt, wp-config-backup.php; a page slug such as
#          /wp-config-explained/ is allowed), PHP source copies, archives in
#          the document root, dumps at any depth, xmlrpc.php,
#          wp-trackback.php, the installer, PHP in uploads/cache, PHP in
#          plugin/theme/mu-plugin vendor/ and node_modules/ trees (bundled
#          libraries are never entry points; PHPUnit's eval-stdin.php,
#          CVE-2017-9841, is the classic case), and the backup plugins'
#          directories
#   2 404  PATH_INFO ("/x.php/y"), logs, shell scripts, config fragments,
#          editor leftovers
# readme.html, license.txt and plugin composer/package.json are no longer
# refused: they only revealed versions that WordPress publishes anyway.
location ~* "(?s)^(?:.*?(?:/\.(?!well-known/)|/wp-config(?!-[a-z0-9-]+(?:\.html?)?$)[^/]*$|\.php[^/]+$|^/(?!sitemap)[^/]+\.(?:zip|tar|tgz|gz|bz2|xz|zst|7z|rar|wpress|sql)$|\.(?:sql(?:\.(?:gz|bz2|xz|zst|lz4|zip|7z))?|lz4|dump|bak|old|orig)$|/(?:xmlrpc|wp-trackback)\.php$|/wp-admin/(?:install|setup-config)\.php$|/wp-content/(?:uploads|cache)/.*\.ph(?:p|tml|ar)(?:/|$)|/wp-content/(?:plugins|themes|mu-plugins)/(?:.*/)?(?:vendor|node_modules)/.*\.ph(?:p|tml|ar)(?:/|$)|/wp-content/(?:wpvividbackups|aiowps_backups|ai1wm-backups|backup-migration-[^/]+|updraft|backups?|upgrade)/)|.*?(?<wp_deny_nf>(?-i:\.php/)|#.*#$|\.(?:conf|dist|in[ci]|log|sh|sw[op])$|~$))" {
    if ($wp_deny_nf) { return 404; }
    deny all;
}
