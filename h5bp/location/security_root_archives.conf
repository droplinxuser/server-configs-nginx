# ----------------------------------------------------------------------
# | Archives and dumps in the document root                            |
# ----------------------------------------------------------------------
# The classic leftovers /backup.zip, /site.tar.gz, /domain.com.sql and
# /migration.wpress.  Only the root is covered; deeper paths
# (/wp-content/uploads/2026/x.zip, a download directory) are legitimate.
# /sitemap*.xml.gz stays reachable: sitemap plugins generate or route it
# from the root.
#
# Included by the application PHP files only (php_wp.conf, php_xf.conf,
# php_chev.conf, php_chev_cache.conf, php_flarum.conf) and by the locations
# that nest the generic h5bp/php.conf for those applications; in such a
# document root an archive is always a leftover.  It is deliberately not part
# of security_backup_files.conf, security_file_access.conf or the generic
# h5bp/php.conf: a regex location wins over `location /`, so on a proxy,
# CDN, download or static vhost a legitimate /release-1.2.zip or
# /data.json.gz would be answered 403 and never reach the upstream or the
# file.  Include it by hand in a vhost that wants the rule.
location ~* ^/(?!sitemap)[^/]+\.(?:zip|tar|tgz|gz|bz2|xz|zst|7z|rar|wpress|sql)$ {
  deny all;
}
