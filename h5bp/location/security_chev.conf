# ----------------------------------------------------------------------
# | Chevereto: every deny rule in one regular expression                |
# ----------------------------------------------------------------------
# Included by h5bp/php_chev_cache.conf and h5bp/php_chev.conf ahead of the
# PHP locations (see security_xf.conf for why one regex).
#   1 404  app/ and importing/ as a whole ("Require all denied" upstream;
#          case-sensitive, so a /user/App/ route still works), .po/.php/
#          .lock/.sql below app/, content/ and lib/ (case-insensitive),
#          composer.json/.lock, .gitignore
#   2 403  dotfiles and VCS, PHP source copies, archives in the document
#          root, dumps at any depth
#   3 404  PATH_INFO ("/x.php/y"), logs, shell scripts, config fragments,
#          editor leftovers
location ~* "(?s)^(?:.*?(?<chev_deny_nf1>(?-i:/(?:app|importing)/)|/(?:app|content|lib)/.*\.(?:po|php|lock|sql)$|/(?:composer\.(?:json|lock)|\.gitignore)$)|.*?(?:/\.(?!well-known/)|\.php[^/]+$|^/(?!sitemap)[^/]+\.(?:zip|tar|tgz|gz|bz2|xz|zst|7z|rar|wpress|sql)$|\.(?:sql(?:\.gz)?|lz4|dump|bak|old|orig)$)|.*?(?<chev_deny_nf3>(?-i:\.php/)|#.*#$|\.(?:conf|dist|in[ci]|log|sh|sw[op])$|~$))" {
    if ($chev_deny_nf1) { return 404; }
    if ($chev_deny_nf3) { return 404; }
    deny all;
}
