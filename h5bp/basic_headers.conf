#
# h5bp/basic.conf without h5bp/location/security_file_access.conf, for vhosts
# whose server-level PHP include carries its own deny location
# (h5bp/php_wp.conf -> security_wp.conf, h5bp/php_chev_cache.conf or
# php_chev.conf -> security_chev.conf).  Keep the header lines in sync with
# basic.conf, which stays for generic and older vhosts.

include h5bp/security/referrer-policy.conf;
include h5bp/security/permissions-policy.conf;
include h5bp/security/x-content-type-options.conf;
include h5bp/security/x-frame-options.conf;
include h5bp/location/security_dot_segments.conf;
include h5bp/cross-origin/requests.conf;

#include h5bp/security/content-security-policy.conf;
#include h5bp/security/permissions-policy.conf;
#include h5bp/security/cross-origin-policy.conf;
include h5bp/security/strict-transport-security.conf;
include h5bp/web_performance/cache-control.conf;
#include h5bp/location/web_performance_filename-based_cache_busting.conf;
#include h5bp/location/web_performance_svgz-compression.conf;
#include h5bp/errors/custom_errors.conf;
