# ----------------------------------------------------------------------
# | Chevereto PHP: uncached location + guest full-page cache            |
# ----------------------------------------------------------------------
# Include this file ONCE, at the server level (it defines a named location,
# which Angie only allows there).  Inside another location use
# h5bp/php_chev.conf, which never caches.
#
#   location ~ \.php       logged-in users, visitors that already have a PHP
#                          session, POSTs and no-cache URIs.  Never cached;
#                          Set-Cookie passes through untouched.
#   @chev_guest_cache      GET/HEAD without any session/login cookie on a
#                          cacheable URI.  Cached, and Set-Cookie is removed.
#
# Chevereto starts a PHP session for every visitor and embeds that session's
# auth_token in the page.  The cache used to store the first visitor's
# `PHPSESSID` and hand it to everybody, so all guests shared one session and
# one token.  Now a cached page carries no cookie, and a visitor that owns a
# session (it is created by any uncached page: /, /login, /upload, /json)
# is always served by PHP, so the token in the page is the visitor's own.
#
# Guest uploads: a cookie-less guest on a cached page has no valid auth_token,
# so an upload from that page is rejected until the page is reloaded.  On a
# site that allows guest uploads include h5bp/php_chev.conf here instead.
#
# $chev_guest_cacheable, $chev_guest_cookie, $nocacheuri_chev and
# $chev_api_request are defined in http.d/fastcgi_cache_chev.conf.

error_page 418 = @chev_guest_cache;

# Backup copies and hidden PHP: these deny rules must precede
# the PHP location below (regex locations are tried in file order).
include h5bp/location/security_backup_files.conf;
# Archives and dumps in the document root (/backup.zip, /site.sql).
include h5bp/location/security_root_archives.conf;

# None of these applications routes through PATH_INFO.  Without this rule
# "/any/script.php/x" skips every "\.php  deny rule above and in the vhost
# and is executed by the PHP location below.
location ~ \.php/ { return 404; }

location ~ [^/]\.php(/|$) {
# A direct /index.php is Chevereto's front controller, not a route: the
# application answers 500 ("Invalid PHP front controller setup") when it sees
# one.  Redirect it to the canonical root before the guest-cache hand-off.
# Internal rewrites keep the original $request_uri (a pretty URL), so they
# never match this test.
if ($request_uri ~ "^/index\.php(?:[?]|$)") { return 301 /$is_args$args; }
# Hand cacheable guest requests to @chev_guest_cache.  `return` runs in the
# rewrite phase, before the rate limiter below, so a request is counted once.
if ($chev_guest_cacheable) { return 418; }

include h5bp/limit_req/*_medium.conf;

fastcgi_pass local_php;
# No upstream keepalive cache: keep_conn would only pin PHP-FPM workers.
fastcgi_keep_conn off;

fastcgi_connect_timeout 360s;
fastcgi_send_timeout 360s;
fastcgi_read_timeout 360s;
fastcgi_buffer_size 64k;
fastcgi_buffers 128 32k;
fastcgi_busy_buffers_size 2m;
fastcgi_temp_file_write_size 16m;
fastcgi_max_temp_file_size 16m;
fastcgi_intercept_errors off;

# PHP responses are dynamic: do not add static-asset Expires headers.
expires off;

# include the fastcgi_param setting
include snippets/fastcgi-php.conf;
fastcgi_param HTTP_PROXY "";
fastcgi_param PATH_TRANSLATED $document_root$fastcgi_script_name;
#fastcgi_param PHP_ADMIN_VALUE open_basedir=$document_root:/tmp:/var/lib/php:/var/www:/usr/local/bin;

# Same header name as the cached location, so the cache state stays visible.
add_header X-30-Cache-Status BYPASS always;
# add_header inside a location replaces the server-level set from basic.conf.
include h5bp/security/referrer-policy.conf;
include h5bp/security/permissions-policy.conf;
include h5bp/security/x-content-type-options.conf;
include h5bp/security/x-frame-options.conf;
include h5bp/security/strict-transport-security.conf;
}

location @chev_guest_cache {
include h5bp/limit_req/*_medium.conf;

fastcgi_pass local_php;
# No upstream keepalive cache: keep_conn would only pin PHP-FPM workers.
fastcgi_keep_conn off;

fastcgi_connect_timeout 360s;
fastcgi_send_timeout 360s;
fastcgi_read_timeout 360s;
fastcgi_buffer_size 64k;
fastcgi_buffers 128 32k;
fastcgi_busy_buffers_size 2m;
fastcgi_temp_file_write_size 16m;
fastcgi_max_temp_file_size 16m;
fastcgi_intercept_errors off;

# PHP responses are dynamic: do not add static-asset Expires headers.
expires off;

# include the fastcgi_param setting
include snippets/fastcgi-php.conf;
fastcgi_param HTTP_PROXY "";
fastcgi_param PATH_TRANSLATED $document_root$fastcgi_script_name;
#fastcgi_param PHP_ADMIN_VALUE open_basedir=$document_root:/tmp:/var/lib/php:/var/www:/usr/local/bin;

### fastcgi_cache start
fastcgi_cache_methods   GET HEAD;
# Chevereto picks the interface language from Accept-Language.  PHP gets the
# normalised first tag ($chev_key_lang) and the key carries the same value,
# so a request cannot store a translation under another language's entry.
fastcgi_param HTTP_ACCEPT_LANGUAGE $chev_key_lang;
fastcgi_cache_key       "$request_method$scheme$host$request_uri|$guest_cache_enc|$chev_key_lang";
fastcgi_cache_lock      on;
fastcgi_cache_use_stale error timeout invalid_header updating http_503;
fastcgi_ignore_headers  Cache-Control Expires Set-Cookie;
# The stored response belongs to another visitor: never replay its cookies.
fastcgi_hide_header     Set-Cookie;
fastcgi_cache           fastcgicache_chev;
# Only cacheable guest requests reach this location; the bypass stays as a
# second line of defence.  $nocacheuri_chev is also 1 for a request that
# carries X-API-Key or Authorization; $chev_api_request repeats that test.
fastcgi_no_cache        $chev_guest_cookie $nocacheuri_chev $chev_api_request;
fastcgi_cache_bypass    $chev_guest_cookie $nocacheuri_chev $chev_api_request;
# First match in file order wins, so the 5xx line must come before "any".
fastcgi_cache_valid     500 502 503 504 0s;
fastcgi_cache_valid     200 206 301 304 1h;
fastcgi_cache_valid     302 303 1m;
fastcgi_cache_valid     404 410 5m;
fastcgi_cache_valid     any 15s;
add_header X-30-Cache-Status $upstream_cache_status always;
# add_header inside a location replaces the server-level set from basic.conf.
include h5bp/security/referrer-policy.conf;
include h5bp/security/permissions-policy.conf;
include h5bp/security/x-content-type-options.conf;
include h5bp/security/x-frame-options.conf;
include h5bp/security/strict-transport-security.conf;
### fastcgi_cache end
}
