# ----------------------------------------------------------------------
# | WordPress guest full-page cache                                     |
# ----------------------------------------------------------------------
# Include this file in a WordPress server block. It caches only anonymous
# GET/HEAD responses; logged-in users, POSTs, wp-admin, wp-login, wp-cron and
# the REST API always reach PHP.
#
# Requires the fastcgicache zone from http.d/fastcgi_cache.conf and the
# $skip_cache map from http.d/wordpress_cache_map.conf (both enabled by
# default in angie.conf). The X-Cache-Status header makes HIT/MISS/BYPASS
# visible during tuning; remove it if you do not want to expose cache state.
#
# Measured on a 16 vCPU VPS with the default Twenty Twenty-Four theme:
#   uncached WordPress  ~242 req/s, p50 187 ms
#   cached WordPress  ~9972 req/s, p50 4.4 ms, p99 8.3 ms

# Cookie safety: Set-Cookie is deliberately NOT in fastcgi_ignore_headers, so
# a response that sets a cookie (a plugin session, a cart, a consent token) is
# never stored and can never be replayed to another visitor.  Do not add it.
#
# $skip_cache is defined without `if` in http.d/wordpress_cache_map.conf,
# which is included by angie.conf in the http context.

fastcgi_cache fastcgicache;
fastcgi_cache_key "$scheme$request_method$host$request_uri|$guest_cache_enc";
fastcgi_cache_valid 200 301 302 60s;
# Error pages must not be cached (or served stale) after an application
# recovers; otherwise a transient 500 can stick for the cache lifetime.
fastcgi_cache_valid 500 502 503 504 0s;
fastcgi_cache_bypass $skip_cache;
fastcgi_no_cache $skip_cache;
fastcgi_cache_use_stale error timeout updating http_503;
fastcgi_cache_background_update on;
fastcgi_cache_lock on;
add_header X-Cache-Status $upstream_cache_status always;
