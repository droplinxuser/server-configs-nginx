# ----------------------------------------------------------------------
# | WordPress guest full-page cache                                     |
# ----------------------------------------------------------------------
# Include this file in a WordPress server block. It caches only anonymous
# GET/HEAD responses; logged-in users, POSTs, wp-admin, wp-login, wp-cron and
# the REST API always reach PHP.
#
# Requires the fastcgicache zone from http.d/fastcgi_cache.conf (enabled by
# default in angie.conf). The X-Cache-Status header makes HIT/MISS/BYPASS
# visible during tuning; remove it if you do not want to expose cache state.
#
# Measured on a 16 vCPU VPS with the default Twenty Twenty-Four theme:
#   uncached WordPress  ~242 req/s, p50 187 ms
#   cached WordPress  ~9972 req/s, p50 4.4 ms, p99 8.3 ms

set $skip_cache 0;
if ($request_method = POST) { set $skip_cache 1; }
if ($http_cookie ~* "wordpress_logged_in|wp-postpass|comment_author") { set $skip_cache 1; }
if ($request_uri ~* "^/(wp-admin|wp-login|wp-cron|wp-json)") { set $skip_cache 1; }

fastcgi_cache fastcgicache;
fastcgi_cache_key "$scheme$request_method$host$request_uri";
fastcgi_cache_valid 200 301 302 60s;
fastcgi_cache_bypass $skip_cache;
fastcgi_no_cache $skip_cache;
fastcgi_cache_use_stale error timeout updating http_500 http_503;
fastcgi_cache_background_update on;
fastcgi_cache_lock on;
add_header X-Cache-Status $upstream_cache_status always;
