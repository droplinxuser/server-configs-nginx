proxy_http_version 1.1;

# Pass the application's own Cache-Control through: the http-level
# `expires $expires` map would stamp max-age=1y on a proxied download.
expires off;

proxy_redirect off;
proxy_ssl_verify off;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Replay flag for TLS 1.3 early data (empty unless ssl_early_data is on).
proxy_set_header Early-Data            $ssl_early_data;
proxy_set_header Connection        "";

proxy_connect_timeout 100s;
proxy_send_timeout    100s;
proxy_read_timeout    100s;

proxy_buffering on;
proxy_buffer_size 32k;
proxy_buffers 512 32k;
proxy_busy_buffers_size 1m;
