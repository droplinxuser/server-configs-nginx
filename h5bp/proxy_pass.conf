# Upstream connection reuse needs both halves: HTTP/1.1 with an empty
# Connection header (set here) AND an upstream block with `keepalive` in the
# vhost.  A bare `proxy_pass https://203.0.113.5;` never keeps an idle
# connection, so every request pays a new TCP + TLS handshake to the origin:
# 0.54 s vs 0.18 s median through a front proxy 127 ms from its origin.
#
#   upstream origin_example {
#       server 203.0.113.5:443;
#       keepalive 16;
#       keepalive_timeout 20s;   # below the origin's keepalive_timeout (30s)
#       keepalive_requests 10000;
#   }
#   location / {
#       proxy_pass https://origin_example;
#       include h5bp/proxy_pass.conf;
#   }
#
# The upstream name is never sent to the origin: SNI and Host are $host.
proxy_http_version 1.1;

# Pass the application's own Cache-Control through: the http-level
# `expires $expires` map would stamp max-age=1y on a proxied download.
expires off;

proxy_redirect off;
# Upstream TLS verification is OFF by default: every origin installed by
# setup.sh gets a self-signed certificate, and a proxy that verifies against
# the public CA bundle answers 502 ("self-signed certificate") for the whole
# site.  With verification off the hop is still encrypted, but it does not
# authenticate the origin; use it only on a trusted network, or turn it back
# on when every origin presents a publicly trusted certificate (for example
# Cloudflare Origin CA installed on the origin) and keep proxy_ssl_name set
# to the certificate's name.
proxy_ssl_verify off;
proxy_ssl_verify_depth 2;
proxy_ssl_server_name on;
# SNI is the site name, the same name sent as Host below.  $proxy_host is the
# proxy_pass address: for an origin given by IP (proxy_pass https://203.0.113.5)
# that sent the IP literal, and an origin whose catch-all refuses unknown SNI
# (`ssl_reject_handshake on` in conf.d/1.https.default.conf since 1.6.46)
# answered "unrecognized name", so every request was a 502 at the proxy.
proxy_ssl_name $host;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $proxy_x_forwarded_for;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $php_public_port;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $app_scheme;
proxy_set_header Connection        "";

proxy_connect_timeout 100s;
proxy_send_timeout    100s;
proxy_read_timeout    100s;

proxy_buffering on;
proxy_buffer_size 32k;
# 8 x 32k = 256 KiB per in-flight response; larger bodies spill to a temp
# file.  The old 512 x 32k (16 MiB per request) let a few hundred slow
# readers exhaust RAM.
proxy_buffers 8 32k;
proxy_busy_buffers_size 128k;
