proxy_http_version 1.1;

# Pass the application's own Cache-Control through: the http-level
# `expires $expires` map would stamp max-age=1y on a proxied download.
expires off;

proxy_redirect off;
# Upstream TLS verification is OFF by default for the same reason as
# h5bp/proxy_pass.conf: setup.sh origins use self-signed certificates, and a
# verifying proxy answers 502 for every request.  The hop stays encrypted but
# the origin is not authenticated; re-enable only with a trusted origin cert
# (Cloudflare Origin CA) and a matching proxy_ssl_name.
proxy_ssl_verify off;
proxy_ssl_verify_depth 2;
proxy_ssl_server_name on;
# SNI is the site name, the same name sent as Host (see h5bp/proxy_pass.conf):
# $proxy_host sent an IP literal that a 1.6.46+ origin refuses.
proxy_ssl_name $host;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $php_public_port;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $app_scheme;
# Replay flag for TLS 1.3 early data (empty unless ssl_early_data is on).
proxy_set_header Early-Data            $ssl_early_data;
proxy_set_header Connection        "";
# The origin compresses by the header it is given: pass the key's encoding
# cannot store a gzip body in the plain entry.  Usual headers pass unchanged.
proxy_set_header Accept-Encoding   $xf_proxy_ae;

proxy_connect_timeout 100s;
proxy_send_timeout    100s;
proxy_read_timeout    100s;

proxy_buffering on;
proxy_buffer_size 32k;
# 8 x 32k = 256 KiB per in-flight response; larger bodies spill to a temp
# file.  The old 512 x 32k (16 MiB per request) let a few hundred slow
# readers exhaust RAM.
proxy_buffers 8 32k;
proxy_busy_buffers_size 128k;

### proxy_cache start
proxy_cache_methods     GET HEAD;
proxy_cache_key         "$request_method|$scheme|$host|$request_uri|$xf_key_variation|$xf_key_style|$xf_key_language|$guest_cache_enc";
proxy_cache_lock        on;
proxy_cache_use_stale   error timeout invalid_header updating http_503;
# Set-Cookie is honoured on purpose: a response that sets a cookie is never
# stored, so the cache cannot replay one visitor's cookie to another.  (The
# FastCGI path strips it in a guest-only location instead; a plain include
# cannot hide the header without also breaking login responses.)
proxy_ignore_headers    Cache-Control Expires Vary;
proxy_cache             xfproxycache; 

# Same guest test as h5bp/php_xf.conf (http.d/fastcgi_cache.conf): cookie
# map, case-insensitive and slash-tolerant URI map, API headers, a
# percent-encoded path, and the default-deny cookie allowlist.  Without
# $guest_cookie_unlisted a request carrying an SSO/add-on auth cookie (or a
# session cookie under a prefix the session map cannot see) reached the
# origin as a member, the origin answered without Set-Cookie, and this cache
# stored that member's page for every guest for 5 minutes.
proxy_no_cache          $xf_guest_cookie $nocacheuri $xf_api_request $req_encoded_path $guest_cookie_unlisted $guest_cache_vary_other $guest_cache_enc_mismatch;
proxy_cache_bypass      $xf_guest_cookie $nocacheuri $xf_api_request $req_encoded_path $guest_cookie_unlisted;

# First match in file order wins: errors are never stored, and neither is an
# origin 403 (a ban or permission notice for one visitor) or 429 (that
# visitor's rate limit): shared for 5 s, either one took the page down for
# every guest (php_xf.conf already refuses 403).
proxy_cache_valid       500 502 503 504 0s;
proxy_cache_valid       403 429 0s;
proxy_cache_valid       200     5m;
proxy_cache_valid       301     1h;
proxy_cache_valid       302 303 1m;
proxy_cache_valid       404     1m;
proxy_cache_valid       any     5s;

add_header X-Cache-Status $upstream_cache_status always;
### proxy_hide_header x-xf-cache-status;
### proxy_cache end
