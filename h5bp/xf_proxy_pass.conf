proxy_http_version 1.1;

# Pass the application's own Cache-Control through: the http-level
# `expires $expires` map would stamp max-age=1y on a proxied download.
expires off;

proxy_redirect off;
proxy_ssl_verify off;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Replay flag for TLS 1.3 early data (empty unless ssl_early_data is on).
proxy_set_header Early-Data            $ssl_early_data;
proxy_set_header Connection        "";

proxy_connect_timeout 100s;
proxy_send_timeout    100s;
proxy_read_timeout    100s;

proxy_buffering on;
proxy_buffer_size 32k;
proxy_buffers 512 32k;
proxy_busy_buffers_size 1m;

### proxy_cache start
proxy_cache_methods     GET HEAD;
proxy_cache_key         "$request_method|$scheme|$host|$request_uri|$xf_key_variation|$xf_key_style|$xf_key_language|$guest_cache_enc";
proxy_cache_lock        on;
proxy_cache_use_stale   error timeout invalid_header updating http_503;
# Set-Cookie is honoured on purpose: a response that sets a cookie is never
# stored, so the cache cannot replay one visitor's cookie to another.  (The
# FastCGI path strips it in a guest-only location instead; a plain include
# cannot hide the header without also breaking login responses.)
proxy_ignore_headers    Cache-Control Expires;
proxy_cache             xfproxycache; 

# Same guest test as h5bp/php_xf.conf (http.d/fastcgi_cache.conf): cookie
# map, case-insensitive and slash-tolerant URI map, API headers.
proxy_no_cache          $xf_guest_cookie $nocacheuri $xf_api_request;
proxy_cache_bypass      $xf_guest_cookie $nocacheuri $xf_api_request;

# First match in file order wins: errors are never stored.
proxy_cache_valid       500 502 503 504 0s;
proxy_cache_valid       200     5m;
proxy_cache_valid       301     1h;
proxy_cache_valid       302 303 1m;
proxy_cache_valid       404     1m;
proxy_cache_valid       any     5s;

add_header X-Proxy-Cache $upstream_cache_status always;
### proxy_hide_header x-xf-cache-status;
### proxy_cache end
