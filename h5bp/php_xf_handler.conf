# Uncached XenForo PHP handler: the body of `location = /index.php` and
# `location ~ [^/]\.php$` in h5bp/php_xf.conf.  Both match only a URI that
# ends in ".php", so there is no PATH_INFO split (snippets/fastcgi-php-noinfo.conf).
include h5bp/limit_req/*_medium.conf;

fastcgi_pass local_php;
# No upstream keepalive cache: keep_conn would only pin PHP-FPM workers.
fastcgi_keep_conn off;

fastcgi_connect_timeout 360s;
fastcgi_send_timeout 360s;
fastcgi_read_timeout 360s;
fastcgi_buffer_size 64k;
fastcgi_buffers 128 32k;
fastcgi_busy_buffers_size 2m;
fastcgi_temp_file_write_size 16m;
fastcgi_max_temp_file_size 16m;
fastcgi_intercept_errors off;

# PHP responses are dynamic: do not add static-asset Expires headers.
expires off;

# include the fastcgi_param setting
include snippets/fastcgi-php-noinfo.conf;
fastcgi_param HTTP_PROXY "";
# Uncached XenForo pages (members, guest bypass, admin.php, job.php) are
# compressed by nginx, not by XenForo.  XenForo gzips at level 9 inside the
# PHP worker whenever the request header names gzip: 12 % of all PHP-FPM CPU
# on a member thread page.  With the header withheld PHP sends plain HTML and
# nginx compresses it (Brotli or gzip, http.d/brotli.conf) outside the pool.
# The guest cache keeps XenForo's own gzip body ($guest_cache_ae in
# php_xf.conf), so a cache hit is never compressed again.  This works from the
# first request of a new install; the src/config.php block setup.sh used to
# rely on (XF_MEMBER_GZIP) is only written by --optimize.
fastcgi_param HTTP_ACCEPT_ENCODING "";
fastcgi_param PATH_TRANSLATED $document_root$fastcgi_script_name;
#fastcgi_param PHP_ADMIN_VALUE open_basedir=$document_root/:/tmp/:/usr/bin/;

# Same header name as the cached location, so the cache state stays visible.
add_header X-Cache-Status BYPASS always;
# add_header inside a location replaces the server-level set, so the
# security headers from basic_xf_headers.conf would otherwise vanish from every PHP
# response (HSTS included).  Re-include them here.
include h5bp/security/strict-transport-security.conf;
include h5bp/security/referrer-policy.conf;
# XenForo sends its own X-Content-Type-Options: nosniff (AbstractRenderer,
# Proxy and Oembed controllers); hide it so the response carries one copy,
# the `always` one below that also covers error pages.
fastcgi_hide_header X-Content-Type-Options;
include h5bp/security/x-content-type-options.conf;
include h5bp/cross-origin/requests.conf;
include h5bp/security/permissions-policy.conf;
include h5bp/security/cross-origin-policy.conf;
include h5bp/web_performance/cache-control.conf;
