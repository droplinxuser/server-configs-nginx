    ### Start Xenforo
    location / {
        try_files $uri $uri/ /index.php?$uri&$args;
        index index.php index.html;
    }

    # Private trees ("Require all denied" upstream): src/config.php, vendor,
    # code_cache, attachments, temp.  ^~ ends the location search: no regex
    # runs and every file below them is a 404.  PHP in these trees below the
    # root (a board in a subdirectory) is refused by
    # h5bp/location/security_xf.conf.
    location ^~ /internal_data { internal; }
    location ^~ /src { internal; }

    # Cached PHP endpoints.  Exact matches cost no regex and, unlike the old
    # ^~ prefixes, do not claim /proxy.php.bak (served as text) or
    # /css.php/x (executed with PATH_INFO).  PHP responses carry no Expires
    # header (h5bp/php_xf_proxy.conf: expires off).
    location = /proxy.php { include h5bp/php_xf_proxy.conf; }
    location = /css.php { include h5bp/php_xf_proxy.conf; }
    location = /webmanifest.php { include h5bp/php_xf_proxy.conf; }
    location = /sitemap.php { include h5bp/php_xf_proxy.conf; }
    location = /sitemap.xml { return 302 /sitemap.php; }

    location = /ads.txt {
        sendfile off;
        expires 2h;
    }

    # XenForo 2 keeps no files below /attachments: the route is served by
    # index.php with a higher rate-limit burst.  A plain prefix, so the deny
    # rule in h5bp/location/security_xf.conf still applies.
    location /attachments {
        include h5bp/limit_req/*_high.conf;
        try_files $uri /index.php?$uri&$args;
    }

    # Smaller upload limit for avatars and banners (checked against
    # Content-Length before try_files hands the request to index.php).
    location /account/avatar {
        client_max_body_size 5m;
        try_files $uri /index.php?$uri&$args;
    }
    location /account/banner {
        client_max_body_size 5m;
        try_files $uri /index.php?$uri&$args;
    }

    # setup.sh: static asset cache (XenForo /js, /styles, /data) lives in the
    # ^~ blocks below (h5bp/location/xf_static_assets.conf); this marker keeps
    # setup.sh tune_xf_static_assets from injecting its own regex location.
    # ^~ skips the server-level regexes, so each block repeats the deny rule
    # before the long-cache rule.
    location ^~ /data/ {
        limit_except GET OPTIONS { deny all; }
        include h5bp/location/security_xf.conf;
        include h5bp/location/xf_static_assets.conf;
    }

    location /data/siropu/shoutbox/shouts.json {
        expires -1;
        limit_except GET OPTIONS POST { deny all; }
    }

    location ^~ /js/ {
        limit_except GET { deny all; }
        include h5bp/location/security_xf.conf;
        include h5bp/location/xf_static_assets.conf;
    }

    location ^~ /styles/ {
        limit_except GET { deny all; }
        include h5bp/location/security_xf.conf;
        include h5bp/location/xf_static_assets.conf;
    }
    ### End Xenforo
