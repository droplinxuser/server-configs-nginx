# Flarum PHP handler with a guest-only FastCGI cache.
#
# Same split as h5bp/php_xf.conf: a request that may use the shared cache
# ($flarum_guest_cacheable, http.d/fastcgi_cache_flarum.conf) is handed to
# @flarum_guest_cache, where Set-Cookie is dropped; every other request
# (session or remember cookie, API token, /api, /admin, /login ...) goes
# straight to PHP and is never stored.
error_page 418 = @flarum_guest_cache;

# Every deny rule as one regex location (h5bp/location/security_flarum.conf):
# dotfiles, PHP copies, archives, dumps, PHP below assets/, composer files,
# leftovers -- and every ".php" other than the front controller below, so
# Flarum needs no PHP regex location at all.
include h5bp/location/security_flarum.conf;

# Flarum's public/ ships exactly one script, index.php (it also runs the
# installer).  The template installs the forum at the root.  An exact match
# ends both location searches (the original URI and the try_files redirect)
# without a regex.
location = /index.php {
if ($flarum_guest_cacheable) { return 418; }
include h5bp/limit_req/*_medium.conf;

fastcgi_pass local_php;
# No upstream keepalive cache: keep_conn would only pin PHP-FPM workers.
fastcgi_keep_conn off;

fastcgi_connect_timeout 360s;
fastcgi_send_timeout 360s;
fastcgi_read_timeout 360s;
fastcgi_buffer_size 64k;
fastcgi_buffers 128 32k;
fastcgi_busy_buffers_size 2m;
fastcgi_temp_file_write_size 16m;
fastcgi_max_temp_file_size 16m;
fastcgi_intercept_errors off;

# PHP responses are dynamic: do not add static-asset Expires headers.
expires off;

# include the fastcgi_param setting
include snippets/fastcgi-php-noinfo.conf;
fastcgi_param HTTP_PROXY "";
fastcgi_param PATH_TRANSLATED $document_root$fastcgi_script_name;
# See h5bp/php_wp.conf: PHP_ADMIN_VALUE persists per FPM worker and leaks the
# previous vhost's open_basedir. Keep it out of per-request FastCGI params.
#fastcgi_param PHP_ADMIN_VALUE open_basedir=$document_root/:/tmp/;
# Flarum is a PSR-7 stack: a client can send X-Original-URL/X-Rewrite-URL to
# make the framework route to another path while the URI maps (cache bypass,
# credential limiter) still see the requested one.  Blank them on every PHP
# request, not only on the cached one.
fastcgi_param HTTP_X_ORIGINAL_URL "";
fastcgi_param HTTP_X_REWRITE_URL "";

add_header X-Cache-Status BYPASS always;
# add_header inside a location replaces the server-level set.
include h5bp/security/strict-transport-security.conf;
include h5bp/security/referrer-policy.conf;
include h5bp/security/x-content-type-options.conf;
include h5bp/security/x-frame-options.conf;
include h5bp/cross-origin/requests.conf;
include h5bp/security/permissions-policy.conf;
include h5bp/security/cross-origin-policy.conf;
include h5bp/web_performance/cache-control.conf;
}

location @flarum_guest_cache {
# Cached HTML is already compressed by PHP; AIO is for static files.  There is
# deliberately no `brotli off` here: nginx does not re-compress a body that
# already carries Content-Encoding, and the directive is not core, so it made
# the optional module a hard startup dependency.
include h5bp/limit_req/*_medium.conf;

fastcgi_pass local_php;
fastcgi_keep_conn off;

fastcgi_connect_timeout 360s;
fastcgi_send_timeout 360s;
fastcgi_read_timeout 360s;
fastcgi_buffer_size 64k;
fastcgi_buffers 128 32k;
fastcgi_busy_buffers_size 2m;
fastcgi_temp_file_write_size 16m;
fastcgi_max_temp_file_size 16m;
fastcgi_intercept_errors off;

expires off;

include snippets/fastcgi-php-noinfo.conf;
fastcgi_param HTTP_PROXY "";
# The key's encoding, not the client's raw header ($guest_cache_ae in
# http.d/fastcgi_cache.conf): the stored body must match the key.
fastcgi_param HTTP_ACCEPT_ENCODING $guest_cache_ae;
fastcgi_param PATH_TRANSLATED $document_root$fastcgi_script_name;
# The key has no room for the URL-override headers some PSR-7 stacks honour.
fastcgi_param HTTP_X_ORIGINAL_URL "";
fastcgi_param HTTP_X_REWRITE_URL "";

### fastcgi_cache start
fastcgi_cache_methods   GET HEAD;
fastcgi_cache_key       "$request_method|$app_scheme|$host|$php_public_port|$cache_request_uri|$guest_cache_enc";
# A unique query string must not evict the hot set (as in php_xf.conf).
fastcgi_cache_min_uses  2;
fastcgi_cache_lock      on;
fastcgi_cache_background_update on;
fastcgi_cache_use_stale error timeout invalid_header updating http_503;
fastcgi_ignore_headers  Cache-Control Expires Set-Cookie Vary;
# A stored page must never replay the first visitor's session cookie.
fastcgi_hide_header     Set-Cookie;
fastcgi_cache           fastcgicache;
# Only cacheable guest requests reach this location; the bypass stays as a
# second line of defence.
fastcgi_no_cache        $flarum_guest_cookie $flarum_nocache_uri $http_authorization $req_encoded_path $cache_uri_tracking $guest_cache_vary_other $guest_cache_enc_mismatch $guest_cookie_unlisted;
fastcgi_cache_bypass    $flarum_guest_cookie $flarum_nocache_uri $http_authorization $req_encoded_path $guest_cookie_unlisted;
# First match in file order wins: never cache an error response.
fastcgi_cache_valid     500 502 503 504 0s;
fastcgi_cache_valid     200 301 5m;
# A discussion id requested before it exists must not stay "not found".
fastcgi_cache_valid     404 1m;
fastcgi_cache_valid     any 5s;

add_header X-Cache-Status $upstream_cache_status always;
include h5bp/security/strict-transport-security.conf;
include h5bp/security/referrer-policy.conf;
include h5bp/security/x-content-type-options.conf;
include h5bp/security/x-frame-options.conf;
include h5bp/cross-origin/requests.conf;
include h5bp/security/permissions-policy.conf;
include h5bp/security/cross-origin-policy.conf;
include h5bp/web_performance/cache-control.conf;
### fastcgi_cache end
}
