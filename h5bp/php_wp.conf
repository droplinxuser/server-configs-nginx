# Every deny rule as one regex location (h5bp/location/security_wp.conf):
# dotfiles, wp-config in every spelling, PHP copies, archives, dumps, logs,
# xmlrpc/trackback/installer, PHP in uploads/cache, the backup plugins'
# directories and PATH_INFO.  It must precede the PHP locations below
# (regex locations are tried in file order).
include h5bp/location/security_wp.conf;

# Front controller: the try_files fallback in h5bp/wordpress.conf and the
# directory index land here without running a regex.
location = /index.php {
include h5bp/php_wp_handler.conf;
}

# wp-cron.php is WordPress's own scheduler entry point.  Every visitor can
# make it start a job run, so the endpoint stays off the internet: only the
# web server itself (spawn_cron posts to it over loopback) may reach it.  A
# host managed by setup.sh runs the queue from the managed crontab instead,
# but a site installed by hand (or an existing site that is not hardened yet)
# relies on this loopback trigger; denying it to everyone silently stops
# scheduled posts, updates and plugin jobs.  The template installs WordPress
# at the root; a subdirectory install needs its own exact block.
location = /wp-cron.php {
  allow 127.0.0.1;
  allow ::1;
  deny all;
  include h5bp/php_wp_handler.conf;
}

# Every other script (wp-login.php, wp-admin/*.php, admin-ajax.php ...).
# "/x.php/y" never gets here: security_wp.conf answers 404 for ".php/".
location ~ [^/]\.php$ {
include h5bp/php_wp_handler.conf;
}
