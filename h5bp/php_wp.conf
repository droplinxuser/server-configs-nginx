# Backup copies and hidden PHP: these deny rules must precede
# the PHP location below (regex locations are tried in file order).
include h5bp/location/security_backup_files.conf;
# Archives and dumps in the document root (/backup.zip, /site.sql).
include h5bp/location/security_root_archives.conf;

# wp-cron.php is WordPress's own scheduler entry point.  Every visitor can
# make it start a job run, so the endpoint stays off the internet: only the
# web server itself (spawn_cron posts to it over loopback) may reach it.  A
# host managed by setup.sh runs the queue from the managed crontab instead,
# but a site installed by hand (or an existing site that is not hardened yet)
# relies on this loopback trigger; denying it to everyone silently stops
# scheduled posts, updates and plugin jobs.
location ~* ^/wp-cron\.php$ {
  allow 127.0.0.1;
  allow ::1;
  deny all;
  include h5bp/location/php_wp_handler.conf;
}

# PHP endpoints that must never be reachable.  These live here (not only in
# security_file_access.conf) because regex locations match in file order and
# the generic PHP block below would otherwise execute them.
location ~* ^/(?:wp-config\.php|xmlrpc\.php|wp-trackback\.php|wp-admin/install\.php|wp-admin/setup-config\.php)$ {
  deny all;
}

# Never execute PHP from writable upload/cache/backup directories.  This rule
# must appear before the generic PHP location: regex locations are matched in
# file order, and the generic block below would otherwise execute it.
location ~* ^/wp-content/(?:uploads|upgrade|cache|backups?|wpvividbackups|aiowps_backups|backup-migration-[^/]+)/.*\.(?:php|phtml|phar)(?:/|$) {
  deny all;
}

# None of these applications routes through PATH_INFO.  Without this rule
# "/any/script.php/x" skips every "\.php  deny rule above and in the vhost
# and is executed by the PHP location below.
location ~ \.php/ { return 404; }

location ~ [^/]\.php(/|$) {
include h5bp/location/php_wp_handler.conf;
}
