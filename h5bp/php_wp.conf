# PHP endpoints that must never be reachable.  These live here (not only in
# security_file_access.conf) because regex locations match in file order and
# the generic PHP block below would otherwise execute them.
location ~* ^/(?:wp-config\.php|xmlrpc\.php|wp-cron\.php|wp-trackback\.php|wp-admin/install\.php|wp-admin/setup-config\.php)$ {
  deny all;
}

# Never execute PHP from writable upload/cache/backup directories.  This rule
# must appear before the generic PHP location: regex locations are matched in
# file order, and the generic block below would otherwise execute it.
location ~* ^/wp-content/(?:uploads|upgrade|cache|backups?|wpvividbackups|aiowps_backups|backup-migration-[^/]+)/.*\.(?:php|phtml|phar)(?:/|$) {
  deny all;
}

# None of these applications routes through PATH_INFO.  Without this rule
# "/any/script.php/x" skips every "\.php  deny rule above and in the vhost
# and is executed by the PHP location below.
location ~ \.php/ { return 404; }

location ~ [^/]\.php(/|$) {
include h5bp/limit_req/*_medium.conf;

fastcgi_pass local_php;
# No upstream keepalive cache: keep_conn would only pin PHP-FPM workers.
fastcgi_keep_conn off;

fastcgi_connect_timeout 360s;
fastcgi_send_timeout 360s;
fastcgi_read_timeout 360s;
fastcgi_buffer_size 64k;
fastcgi_buffers 128 32k;
fastcgi_busy_buffers_size 2m;
fastcgi_temp_file_write_size 16m;
fastcgi_max_temp_file_size 16m;
fastcgi_intercept_errors off;

# PHP responses are dynamic: do not add static-asset Expires headers.
expires off;

# include the fastcgi_param setting
include snippets/fastcgi-php.conf;
fastcgi_param HTTP_PROXY "";
fastcgi_param PATH_TRANSLATED $document_root$fastcgi_script_name;
# Do not set PHP_ADMIN_VALUE open_basedir per vhost: PHP-FPM keeps admin
# values for a worker across requests, so a WordPress request could leave the
# WP document root as the open_basedir for the next vhost served by that
# worker (observed as "open_basedir restriction" on an unrelated stress site).
# Set open_basedir in the pool's php_admin_value[] instead if isolation is
# required for a dedicated pool.
#fastcgi_param PHP_ADMIN_VALUE open_basedir=$document_root/:/tmp/;
}
