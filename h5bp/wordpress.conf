location / {
  #limit_except GET POST { deny all; }
  try_files $uri $uri/ /index.php?$args;
  }

# WooCommerce and Easy Digital Downloads keep paid files here and protect
# them with an Apache .htaccess "deny from all", which Angie never reads:
# without these blocks anyone with the URL downloads the product.  `internal`
# (not `deny`) keeps the plugins' X-Accel-Redirect download method working;
# ^~ stops the regex locations (static-file expiry, PHP) from matching first.
location ^~ /wp-content/uploads/woocommerce_uploads/ { internal; }
location ^~ /wp-content/uploads/edd/ { internal; }

