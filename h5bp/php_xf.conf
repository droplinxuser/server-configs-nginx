# ----------------------------------------------------------------------
# | XenForo PHP: uncached location + guest full-page cache              |
# ----------------------------------------------------------------------
# Include this file ONCE, at the server level (it defines a named location,
# which Angie only allows there).  For a PHP location nested inside another
# location use h5bp/php.conf.
#
# Two locations, because Angie cannot hide a response header conditionally:
#
#   location ~ \.php     members, POSTs and no-cache URIs.  Never cached;
#                        Set-Cookie passes through untouched.
#   @xf_guest_cache      GET/HEAD from a visitor without a session/login
#                        cookie on a cacheable URI.  Cached, and Set-Cookie
#                        is removed from the response.
#
# Why the cookie is removed: the guest cache stores the response of whoever
# requested the page first.  XenForo sets `xf_csrf` on every visitor that has
# no such cookie, so every guest used to receive the first visitor's CSRF
# cookie for the lifetime of the cache entry.  XenForo is built for
# cookie-less cached pages: XF.KeepAlive calls /login/keep-alive (a no-cache
# URI) when the `xf_csrf` cookie is missing and installs a fresh token.
#
# $xf_guest_cacheable, $xf_guest_cookie, $nocacheuri and $xf_api_request
# are defined in http.d/fastcgi_cache.conf.

error_page 418 = @xf_guest_cache;

# Backup copies and hidden PHP: these deny rules must precede
# the PHP location below (regex locations are tried in file order).
include h5bp/location/security_backup_files.conf;
# Archives and dumps in the document root (/backup.zip, /site.sql).
include h5bp/location/security_root_archives.conf;

# None of these applications routes through PATH_INFO.  Without this rule
# "/any/script.php/x" skips every "\.php  deny rule above and in the vhost
# and is executed by the PHP location below.
location ~ \.php/ { return 404; }

location ~ [^/]\.php(/|$) {
# Hand cacheable guest requests to @xf_guest_cache.  `return` runs in the
# rewrite phase, before the rate limiter below, so a request is counted once.
if ($xf_guest_cacheable) { return 418; }

include h5bp/limit_req/*_medium.conf;

fastcgi_pass local_php;
# No upstream keepalive cache: keep_conn would only pin PHP-FPM workers.
fastcgi_keep_conn off;

fastcgi_connect_timeout 360s;
fastcgi_send_timeout 360s;
fastcgi_read_timeout 360s;
fastcgi_buffer_size 64k;
fastcgi_buffers 128 32k;
fastcgi_busy_buffers_size 2m;
fastcgi_temp_file_write_size 16m;
fastcgi_max_temp_file_size 16m;
fastcgi_intercept_errors off;

# PHP responses are dynamic: do not add static-asset Expires headers.
expires off;

# include the fastcgi_param setting
include snippets/fastcgi-php.conf;
fastcgi_param HTTP_PROXY "";
fastcgi_param PATH_TRANSLATED $document_root$fastcgi_script_name;
#fastcgi_param PHP_ADMIN_VALUE open_basedir=$document_root/:/tmp/:/usr/bin/;

# Same header name as the cached location, so the cache state stays visible.
add_header X-5m-Cache BYPASS always;
# add_header inside a location replaces the server-level set, so the
# security headers from basic_xf.conf would otherwise vanish from every PHP
# response (HSTS included).  Re-include them here.
include h5bp/security/strict-transport-security.conf;
include h5bp/security/referrer-policy.conf;
}

# Keep this location last in the file: setup.sh --optimize repairs a missing
# cache directive by inserting it before the final closing brace.
location @xf_guest_cache {
include h5bp/limit_req/*_medium.conf;

fastcgi_pass local_php;
# No upstream keepalive cache: keep_conn would only pin PHP-FPM workers.
fastcgi_keep_conn off;

fastcgi_connect_timeout 360s;
fastcgi_send_timeout 360s;
fastcgi_read_timeout 360s;
fastcgi_buffer_size 64k;
fastcgi_buffers 128 32k;
fastcgi_busy_buffers_size 2m;
fastcgi_temp_file_write_size 16m;
fastcgi_max_temp_file_size 16m;
fastcgi_intercept_errors off;

# PHP responses are dynamic: do not add static-asset Expires headers.
expires off;

# include the fastcgi_param setting
include snippets/fastcgi-php.conf;
fastcgi_param HTTP_PROXY "";
fastcgi_param PATH_TRANSLATED $document_root$fastcgi_script_name;
#fastcgi_param PHP_ADMIN_VALUE open_basedir=$document_root/:/tmp/:/usr/bin/;

### fastcgi_cache start
fastcgi_cache_methods   GET HEAD;
# Cookie values are attacker-chosen: only the validated $xf_key_* tokens
# (http.d/fastcgi_cache.conf) enter the key, each behind a delimiter, so a
# cookie can not complete another URL (uri "/" + cookie "threads/x.1/").
fastcgi_cache_key       "$request_method|$scheme|$host|$request_uri|$xf_key_variation|$xf_key_style|$xf_key_language|$guest_cache_enc";
fastcgi_cache_lock      on;
fastcgi_cache_use_stale error timeout invalid_header updating http_503;
fastcgi_ignore_headers  Cache-Control Expires Set-Cookie;
# The stored response belongs to another visitor: never replay its cookies.
fastcgi_hide_header     Set-Cookie;
fastcgi_cache           fastcgicache;

# Only cacheable guest requests reach this location; the bypass stays as a
# second line of defence.  $nocacheuri is also 1 for a request that carries
# XF-Api-Key, XF-Api-User or Authorization; $xf_api_request repeats that
# test on its own so it survives if the URI map is ever replaced.
fastcgi_no_cache        $xf_guest_cookie $nocacheuri $xf_api_request;
fastcgi_cache_bypass    $xf_guest_cookie $nocacheuri $xf_api_request;

# fastcgi_cache_valid is first-match in file order, so the 5xx line must come
# before "any": never cache an error or serve a stale 500 after recovery.
fastcgi_cache_valid     500 502 503 504 0s;
fastcgi_cache_valid     200     5m;
fastcgi_cache_valid     301     1h;
# "latest post" and "what's new" redirects change with every reply.
fastcgi_cache_valid     302 303 1m;
# A block or permission notice is rendered for one visitor.
fastcgi_cache_valid     403     0s;
# A "not found" for the next post/member id must not outlive its creation.
fastcgi_cache_valid     404     1m;
fastcgi_cache_valid     any     5s;

add_header X-5m-Cache $upstream_cache_status always;
# add_header inside a location replaces the server-level set (see above).
include h5bp/security/strict-transport-security.conf;
include h5bp/security/referrer-policy.conf;
### fastcgi_hide_header x-xf-cache-status;
### fastcgi_cache end
}
