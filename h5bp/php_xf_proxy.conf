# Shared-cache body for `location = /proxy.php`, `= /css.php`,
# `= /webmanifest.php` and `= /sitemap.php` (h5bp/xf2.conf).  A location
# body, not a location: an exact location cannot nest another one.  These
# endpoints are cached for every visitor (members included) except a
# header-authenticated or session request.
# Cache hits are small compressed objects; AIO only adds CPU.  No
# `brotli off`: Angie does not re-compress an encoded body, and the directive
# made the optional module a hard startup dependency.
aio off;
include h5bp/limit_req/*_high.conf;

fastcgi_pass local_php;
# No upstream keepalive cache: keep_conn would only pin PHP-FPM workers.
fastcgi_keep_conn off;

fastcgi_connect_timeout 360s;
fastcgi_send_timeout 360s;
fastcgi_read_timeout 360s;
fastcgi_buffer_size 64k;
fastcgi_buffers 128 32k;
fastcgi_busy_buffers_size 2m;
fastcgi_temp_file_write_size 16m;
fastcgi_max_temp_file_size 16m;
fastcgi_intercept_errors off;

# PHP responses are dynamic: do not add static-asset Expires headers.
expires off;

# Exact script URIs: no PATH_INFO, no split.
include snippets/fastcgi-php-noinfo.conf;
fastcgi_param HTTP_PROXY "";
fastcgi_param PATH_TRANSLATED $document_root$fastcgi_script_name;
#fastcgi_param PHP_ADMIN_VALUE open_basedir=$document_root/:/tmp/:/usr/bin/;

### fastcgi_cache start
fastcgi_cache_methods   GET HEAD;
fastcgi_cache_key       "$request_method|$app_scheme|$host|$php_public_port|$cache_request_uri|$xf_key_variation|$xf_key_style|$xf_key_language|$guest_cache_enc";
fastcgi_cache_lock      on;
fastcgi_cache_use_stale error timeout invalid_header updating http_503;
fastcgi_ignore_headers  Cache-Control Expires Set-Cookie;
# These endpoints are cached for every visitor: never replay a stored cookie.
fastcgi_hide_header     Set-Cookie;
fastcgi_cache           fastcgicache;
# These endpoints are cached for members too, but a response to a request
# that authenticates with a header (API key, OAuth2 or HTTP authentication)
# belongs to that client alone.  A session cookie is the same kind of marker:
# /attachments/<id>/ can be a private-forum or conversation attachment, and
# the shared cache would otherwise store a member's copy under a URL a guest
# can request (Set-Cookie is hidden, so nothing else distinguishes them).
fastcgi_no_cache        $xf_api_request $xf_guest_cookie $req_encoded_path $cache_uri_tracking;
fastcgi_cache_bypass    $xf_api_request $xf_guest_cookie $req_encoded_path;
# First match in file order wins, so the 5xx line must come before "any".
fastcgi_cache_valid     500 502 503 504 0s;
fastcgi_cache_valid     200 1h;
fastcgi_cache_valid     404 1m;
fastcgi_cache_valid     any 5s;

add_header X-Cache-Status $upstream_cache_status always;
# add_header inside a location replaces the server-level set (see php_xf.conf).
include h5bp/security/strict-transport-security.conf;
include h5bp/security/referrer-policy.conf;
# XenForo sends its own X-Content-Type-Options: nosniff (AbstractRenderer,
# Proxy and Oembed controllers); hide it so the response carries one copy,
# the `always` one below that also covers error pages.
fastcgi_hide_header X-Content-Type-Options;
include h5bp/security/x-content-type-options.conf;
include h5bp/cross-origin/requests.conf;
include h5bp/security/permissions-policy.conf;
include h5bp/security/cross-origin-policy.conf;
include h5bp/web_performance/cache-control.conf;
### fastcgi_cache end
