# ----------------------------------------------------------------------
# | HTTP/3 (QUIC)                                                       |
# ----------------------------------------------------------------------

# This is a snippet, not a standalone vhost.  Include it inside an existing
# TLS server block that already has "listen 443 ssl;" and a certificate.
# HTTP/3 is on by default: every TLS server in conf.d/templates includes
# this file right after its "listen ... 443 ssl;" lines (1.7.4).  Delete that
# include line to turn HTTP/3 off for one vhost.  Behind Cloudflare it is
# idle today (Cloudflare reaches the origin over TCP and serves HTTP/3 to
# visitors itself) and ready if Cloudflare starts using it towards origins.
#
# UDP 443 is already open (ubuntu-setup-script's `ufw allow 443` admits both
# TCP and UDP).
#
# No socket options here: they may be given only once per address:port, and
# conf.d/1.https.default.conf owns them for UDP 443
# ("listen 443 quic default_server reuseport rcvbuf=4m sndbuf=4m").  Its
# reuseport is what makes HTTP/3 work with several workers.  Adding
# reuseport (or rcvbuf, sndbuf, backlog, ...) here makes `nginx -t` fail
# with "duplicate listen options".  Never add default_server here either:
# the catch-all refuses an unknown SNI over QUIC exactly as over TCP.
#
# Alt-Svc: an add_header at server level is inherited only by locations
# that set no add_header of their own.  Several shipped location snippets
# set their own (the PHP handlers, the static-asset expiry rules), so
# responses from those locations carry no Alt-Svc.  Browsers learn about
# HTTP/3 from any response that has it (usually the first page); repeat the
# line inside a location when every response must advertise it.

listen      443 quic;
listen [::]:443 quic;
# Generic Segmentation Offload: the kernel splits one large UDP send into
# packets, which saves CPU on large HTTP/3 responses.  Delete this line when
# `ethtool -k <default-route interface> | grep tx-checksumming` shows off,
# or when traffic leaves over IPsec (xfrm) or WireGuard: GSO sends then fail
# with EIO and HTTP/3 connections break.
quic_gso on;
add_header Alt-Svc 'h3=":443"; ma=86400';
