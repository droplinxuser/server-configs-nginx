# ----------------------------------------------------------------------
# | HTTP/3 (QUIC)                                                       |
# ----------------------------------------------------------------------

# This is a snippet, not a standalone vhost.  Include it inside an existing
# TLS server block that already has "listen 443 ssl;" and a certificate, and
# open UDP 443 in the firewall (ufw allow 443/udp).
#
# Angie/Nginx must be built with HTTP/3 support.

listen      443 quic reuseport;
listen [::]:443 quic reuseport;
add_header Alt-Svc 'h3=":443"; ma=86400';
