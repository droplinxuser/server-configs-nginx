# ----------------------------------------------------------------------
# | HTTP/3 (QUIC)                                                       |
# ----------------------------------------------------------------------

# This is a snippet, not a standalone vhost.  Include it inside an existing
# TLS server block that already has "listen 443 ssl;" and a certificate, and
# open UDP 443 in the firewall (ufw allow 443/udp).
#
# Angie/Nginx must be built with HTTP/3 support.
#
# No reuseport here: socket options may be given only once per address:port,
# so enabling HTTP/3 on two vhosts with "listen 443 quic reuseport" makes
# `angie -t` fail with "duplicate listen options".  One shared QUIC listener
# is enough; the kernel does not need per-worker sharding for QUIC.
#
# conf.d/1.https.default.conf owns "listen 443 quic default_server", so an
# unknown SNI over QUIC is refused there exactly as over TCP.  Never add
# default_server here.

listen      443 quic;
listen [::]:443 quic;
add_header Alt-Svc 'h3=":443"; ma=86400';
