# Shared WordPress PHP handler.  Included by `location = /index.php`,
# `= /wp-cron.php` (loopback only) and `~ [^/]\.php$` in h5bp/php_wp.conf,
# so every script runs with exactly the same FastCGI settings.  All three
# match only a URI ending in ".php": no PATH_INFO split.
include h5bp/limit_req/*_medium.conf;

fastcgi_pass local_php;
# No upstream keepalive cache: keep_conn would only pin PHP-FPM workers.
fastcgi_keep_conn off;

fastcgi_connect_timeout 360s;
fastcgi_send_timeout 360s;
fastcgi_read_timeout 360s;
fastcgi_buffer_size 64k;
fastcgi_buffers 128 32k;
fastcgi_busy_buffers_size 2m;
fastcgi_temp_file_write_size 16m;
fastcgi_max_temp_file_size 16m;
fastcgi_intercept_errors off;

# PHP responses are dynamic: do not add static-asset Expires headers.
expires off;

# include the fastcgi_param setting
include snippets/fastcgi-php-noinfo.conf;
fastcgi_param HTTP_PROXY "";
# zlib.output_compression compresses by the header PHP is given: pass the
# guest-cache key's encoding, "gzip" or nothing ($guest_cache_ae,
# http.d/fastcgi_cache.conf), so the stored body follows the key and the
# cache can ignore Vary.  A browser that accepts gzip still gets gzip.
fastcgi_param HTTP_ACCEPT_ENCODING $guest_cache_ae;
fastcgi_param PATH_TRANSLATED $document_root$fastcgi_script_name;
# WordPress sends its own copies of headers the vhost already sets at server
# level (h5bp/basic_headers.conf, inherited here because this handler adds
# no header): X-Frame-Options and Referrer-Policy on wp-login.php and
# wp-admin, X-Content-Type-Options on every REST response.  Hide them so
# each response carries one copy.  A WordPress vhost without
# basic_headers.conf loses these three on PHP responses: include it.
fastcgi_hide_header X-Frame-Options;
fastcgi_hide_header Referrer-Policy;
fastcgi_hide_header X-Content-Type-Options;
# Do not set PHP_ADMIN_VALUE open_basedir per vhost: PHP-FPM keeps admin
# values for a worker across requests, so a WordPress request could leave the
# WP document root as the open_basedir for the next vhost served by the same
# worker (observed as "open_basedir restriction" on an unrelated stress site).
# Set open_basedir in the pool's php_admin_value[] instead if isolation is
# required for a dedicated pool.
#fastcgi_param PHP_ADMIN_VALUE open_basedir=$document_root/:/tmp/;
